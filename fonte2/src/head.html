 IDEIA DO USUÁRIO PARA A TEMPORADA 3: DRAGÕES (pedido: "uma das minhas criaturas de fantasia favoritas são os dragões")
 - Tratar com reverência: são os seres mais antigos e mais fortes do mundo, mais velhos que a Coroa de Auren. Pouco
   vistos; cada aparição é um evento. Arte de chefe caprichadíssima (multi-casas na grade, várias partes animadas).
 - PIADA E GANCHO: dragões juntam TESOUROS, e o protagonista é literalmente um baú de tesouro. O primeiro dragão quer
   guardá-lo na coleção ("você é o baú mais bonito que eu já vi. e fala."). Fuga, negociação e respeito mútuo.
 - O OVO (CONFIRMADO PELO USUÁRIO: "vamos usá-la com certeza"; elemento central da T3): o grupo recebe/encontra um ovo de dragão que só choca no calor; o baú o carrega DENTRO (a companheira reclama
   e adora: "é quentinho"). O FILHOTE nasce no meio da T3 e vira a criatura-estrela do Baú Domador: não é capturado,
   é família. Cresce e EVOLUI por fases ao longo da temporada (como o baú), muda de forma e de técnicas; no fim pode
   levar o grupo voando (viagem rápida melhorada). O jogador escolhe o nome. Elemento definido pela escolha/ambiente
   (fogo, gelo, tempestade, âmbar?), mudando o terreno da grade (queima grama, congela água, eletrifica poças).
 - DRAGÕES COMO NAÇÃO: há um ninho/reino de dragões cujo apoio é necessário para "mover reinos" contra o vilão final; a
   vila que vira nação precisa conquistar esse apoio (provas, diplomacia, um dragão antigo rabugento como juiz).
 - CHEFES DRAGÕES: elementais, usam o terreno (sopro em linha/cone na grade, voo que tira o dragão do alcance por um
   turno, cauda que empurra). Um dragão corrompido pela fome de âmbar como chefe trágico.
 - SEGREDO (nunca no chat): o dragão mais velho lembra de antes da primeira viagem; viu a "barca" chegar e sabe que o
   âmbar tem dono. Dragões não podem ser catalogados (grandes e velhos demais para caber numa ficha): pista e arma.
 - Regras: dragões são raros (não virar monstro comum de mapa), com personalidade própria cada um; nada de copiar
   dragões de outras obras (nomes, visuais e raças originais).

 IDEIA DO USUÁRIO PARA A TEMPORADA 3: MAIS HOMENS NO GRUPO (pedido: "o baú está muito cercado de moças... mais alguns
 personagens masculinos jogáveis para não acabar virando um harém")
 - ELENCO DE GRUPO na T3: o baú fixo + 2 escolhidos de um elenco que cresce com a vila (regra do trio continua). Na arena
   em grade cada um tem papel claro. Amizade e rivalidade entre homens como eixo de humor e de drama, longe do romance.
 - TIAGO (Herói nº 30, o ex-cobrador do 31): entra fixo no elenco. O único outro do ônibus que luta; "irmão de estrada"
   do baú (piadas de Brasil que só os dois entendem, a passagem que nunca foi cobrada). Lança/escudo de herói, quebra
   escudo e PROTEGE casa vizinha na grade; a Avaliação dele é o BILHETE. Conflito: a Coroa ainda o quer como herói.
 - SARGENTO BRÁS (Guilda): veterano rabugento de besta e armadilhas. Controle da grade: arma armadilhas, empurra, segura
   corredor. Figura paterna seca ("não é carinho, é procedimento"). Cuida da guarda da vila.
 - OTÁVIO (novo): aprendiz de magia rúnica da Coroa, arrogante e brilhante, estudou a vida inteira e não dobra uma caixa
   de fósforos; descobre que um MÍMICO dobra o espaço e fica obcecado (começa como quem vigia/cobiça, vira aliado).
   Mago de área e de terreno (molha, congela, desenha linhas). Rival cômico do baú e da companheira-habilidade (ela o
   corrige o tempo todo: "glifo torto."). Pode ligar a trama de quem caça dobradores de espaço.
 - Convidados pontuais continuam (Tico e outros), mas os três acima são jogáveis de verdade, com evolução e técnicas.

 IDEIA DO USUÁRIO PARA A TEMPORADA 3: COMBATE TÁTICO EM GRADE + O BAÚ DOMADOR (registrada na T2)
 - Pedidos: "posicionamento de personagens durante as lutas, com deslocamento, estilo Baldur's Gate" (em pixel art);
   "uma mecânica de invocação"; "o baú com uma mecânica estilo o Osamodas, de Wakfu; pegar muito do estilo de batalhas
   desse jogo". Inspiração só de MECÂNICA: nada de nomes, criaturas ou visual de outras obras. Tudo original.
 - ARENA EM GRADE: compacta pela tela 240x240 (~9x7 casas). Toque/cursor: escolher casa para andar, alvo para agir.
   A arena nasce do mapa onde a luta começou. Chefes têm arenas montadas como quebra-cabeça.
 - RECURSOS DO TURNO (como Wakfu): pontos de AÇÃO para golpes/feitiços + PASSOS para andar ("PM" já é mana na série, por
   isso Passos). Tensão continua existindo. LINHA DO TEMPO visível com a ordem de todos, invocações incluídas.
 - TRAVAR: sair de perto de um inimigo custa Passos ou pode falhar. O baú (pesado) segura bem; a forma humana (ágil)
   escapa bem. DIREÇÃO: golpe pelas costas causa mais dano, de lado um pouco mais. EMPURRAR: colisão com parede, pedra ou
   outra unidade causa dano (Cuspe de Tralha empurra).
 - TERRENO COM ELEMENTOS (estilo Baldur's Gate): poça molhada conduz relâmpago, fogo queima grama, frio congela água,
   linha de SAL bloqueia alguns inimigos; lugar alto dá vantagem; cobertura.
 - MAGIA DE CÍRCULO VIRA ÁREA: o tamanho do círculo (p/m/g) define quantas casas cobre; escolher ONDE desenhar faz parte
   da estratégia. Custo de tinta igual ao da T2.
 - PAPÉIS: o BAÚ é tanque e COBERTURA viva (aliado atrás dele se protege), pode GUARDAR um aliado e levá-lo a outra casa;
   a FORMA HUMANA anda mais, flanqueia e faz o Golpe a Dois ao lado da Rita; a RITA segura a linha; a LUME apoia de longe.
 - O BAÚ DOMADOR (inspirado no Osamodas; evolução natural de quem engole coisas desde a T1):
   . CAPTURAR: inimigo fraco pode ser ENGOLIDO em vez de derrotado (evolui o Guardar Dentro). Fica no INVENTÁRIO VIVO
     dentro do baú (4 a 6 vagas).
   . INVOCAR: abre a tampa e solta a criatura numa casa ao lado; ela luta do nosso lado com os golpes que tinha.
   . CUIDAR/TREINAR: criaturas sobem de nível com o uso; se caírem vezes demais, se vão de vez (apego e escolhas).
   . ORDENS: técnicas do baú para fortalecer, curar ou trocar de lugar com a criatura.
   . COLEÇÃO: cada espécie capturada entra no Catálogo; criaturas raras viram conteúdo opcional.
 - OUTRAS INVOCAÇÕES: TRALHA VIVA (o baú gasta um item do inventário e o objeto vira criaturinha por alguns turnos: dá
   mais uso ao cobre); CÍRCULO DE INVOCAÇÃO (runa de invocação no centro; o elemento escolhe a criatura: Sal = bloco que
   ninguém atravessa, Água = cura e molha, Fogo = explode ao cair; tamanho = resistência; custa tinta); LUME = luzinhas
   que iluminam áreas escuras e revelam inimigos escondidos.
 - REGRAS DE INVOCAÇÃO: uma ativa por personagem; duração limitada; ocupa casa e pode ser atacada (inimigos espertos vão
   atrás dela); age logo depois de quem invocou; sempre tem custo (item, tinta ou Tensão); no máximo 1 criatura do baú em
   campo no começo, 2 mais adiante como recompensa de evolução.
 - O QUE FICA DA SÉRIE: defesas com timing no turno do inimigo (anel, desvio, sequência = híbrido posição + reflexo),
   magia de círculo com tinta, Tensão, equipamentos necessários e desafio alto.
 - RISCOS: lutas mais longas (menos lutas comuns, cada uma mais pensada); tela cheia no celular; IA dos inimigos precisa
   andar, cercar, fugir de terreno perigoso e caçar invocações (o maior trabalho); o robô de balanço precisa aprender a grade.
 - PLANO: antes da história da T3, um PROTÓTIPO jogável à parte (uma arena, o trio contra 3-4 inimigos, água e grama,
   círculo em área, Passos, travar, direção, empurrão, defesas com timing e o baú capturando e soltando uma criatura).
   O usuário joga no celular e aprova o ritmo antes de construir a temporada em cima disso.

 TELETRANSPORTE DA MAGIA ESPACIAL (teleporte.js, pedido do usuário: "caprichar nas artes de teletransporte")

 O CÍRCULO MÁGICO E A TINTA (circulo.js; pedido do usuário: magia com custo, mais visual, inspirada no jeito de
 "desenhar" feitiço de obras de bruxas-escribas; inspiração de MECÂNICA, nada copiado de arte, nome ou símbolo)
 - Toda página do Grimório é um CÍRCULO: SIGILO no meio (elemento; dois entrelaçados = FUSÃO; anel de repetição =
   DOBRADO), SINAIS em volta (Dardo: seta; Onda: ondas nos 4 lados; Véu: escudos em cruz), TAMANHO (P: -20% força,
   -30% PM, ação mais leve; G: +25% força, +40% PM, mais pesada) e ANEL. Anel com BRECHA = Runa de Gatilho.
 - A mesa de escrever (mesaDeEscrever): página de papel à esquerda com o círculo ao vivo, opções à direita (cima/baixo
   escolhe, esquerda/direita muda), descrição embaixo. TRAÇAR abre o minijogo do anel (tracarAnel): gire o direcional
   em volta, sem voltar (borra e recomeça) e sem parar; traço firme = página com +8% de força (s.q). A = traçar devagar.
 - CUSTO: TINTA DE SUPERFÍCIE (G.items.tintaS): 1 por círculo, +1 fusão/dobro, +1 círculo grande. Manter a página
   igual não gasta. Fontes: Papelaria (balcão, 25c), Bazar (36c), Mascate (35c), baús, bichos de fuligem (Cinzinha,
   Rato-Pavio, Lobo de Fuligem, Mãe-Fuligem) e a forja (2 Fuligem Grossa + 1 Pavio Queimado = 3).
 - FUSÕES só com SELO (G.grim.fus = selos conhecidos). História dá 3: Vapor (Iolanda, Cap. 3), Vidro (mesa de areia,
   Cap. 5), Lava Dourada (a Broca, Cap. 7). O resto: baús opcionais (BAU_EXTRA em economia3.js) ou o balcão da Papelaria
   (SELO_LOJA, por capítulo). Os do SAL só explorando. Save antigo: fusões já anotadas viram selos, +8 tintas e um aviso.
 - SAL (elemento opcional): o Zé do cais de Velhágua troca a pedra da salina por 3 Lodos de Rua (depois do Cap. 5).
   Quebra +2 de escudo, barato. Fusões: Salitre (Brasa), Salmoura (Geada), Lágrima (Seiva). Não fecha com Fuligem,
   Areia nem Âmbar.
 - Na luta, o círculo da página aparece na frente do baú antes do feitiço sair.

 ECONOMIA DE VERDADE (economia3.js; pedido do usuário: "o cobre deve ser essencial")

   Fuligem), T4 só na forja, com material RARO de chefe (Lança do Farol, Couraça do Cerco, Batuta de Luz, Xale do Morro).
 - O BAÚ não veste: a FORJA da Rita (base) faz Tampa Reforçada, Dentes de Ferro e Forro de Tinta, graus I a III, com
   materiais + cobres. Todo bicho comum deixa material (DROP2); todo chefe deixa um RARO (não entra no "vender tudo").
 - Itens de luta novos: Frasco Grande (80%), Tinta Azul Forte (40 PM), Pastel de Feira (20% no grupo), Café Coado
   (+25 Tensão), Bomba de Fuligem (todos, TONTO), Sal Grosso (quebra 3). Menu de itens da luta mostra só o que tem.
 - SEU QUIRINO, O MASCATE: no Largo do Hospital a partir do Cap. 4 e seguindo o grupo (Candeia, Acampamento, Vila dos
   Pavios, Sopé, Torre) enquanto o capítulo daquele lugar está aberto. Ele vende e compra material.
 - Regra para capítulos novos: cada capítulo novo põe 1 selo e 1 punhado de tinta em baús opcionais, define os drops dos
   bichos novos e um material raro do chefe, e entra em CAP_INIMIGO/ESC3. Faixa nova de equipamento a cada ~3 capítulos.

 O FESTIVAL TEM O QUE FAZER (festa3.js; pedido do usuário: "mais impressão de festival")

 AJUSTE DE DANO DO BAÚ (pedido do usuário: "a magia dá pouco dano e só a mordida vale a pena")
 - A mordida tem crítico x1,5 pelo anel, então o Dardo (1.15) empatava com ela e ainda custava PM. Agora o Dardo bate

 ARO DE DENTES (pedido do usuário: explicar como o baú corta de forma humana)

 AS FORMAS DO BAÚ (arcas.js; pedido do usuário: "ao evoluir, mudava de forma, e você via as formas")

v92 — A MAGIA DO JOGO 1 VOLTA (pedido do usuário: "era bem rico... elemento, forma e outra coisa"; o usuário escolheu
 igual ao jogo 1 e elementos voltando aos poucos pela história; formas_novas.js + circulo.js):
 - FORMAS (8, como no jogo 1): Dardo/Onda/Véu (Cap. 3), CORRENTE (Cap. 4: salta 65%/40%), ÂNCORA (Cap. 5: 2.1, pesada,

   todos, +25% por aliado de pé, não é pesada), CHAVE (Cap. 9: -2 de escudo sem fraqueza, desfaz reforços). Forma-base fb.
 - MARCAS (o 3º traço do círculo = os modificadores do jogo 1; nas 4 diagonais; +1 tinta; linha "Marca" na mesa):
   Foco (Cap. 3, +60% e 60% mais caro), Eco e Selo (Cap. 4), Dreno (Cap. 5), Maré (Cap. 6: volta 60% quando o próximo
   inimigo for agir), Bandeira (Cap. 7: +20% nos 3 próximos golpes), Bilhete (Cap. 8: próximo golpe contra quem lançou /
   o aliado do véu sai pela metade), Nome (Cap. 10: +30% contra chefes). Selo/Dreno/Maré/Nome só em ataque.
 - ELEMENTOS que voltam no FIM de cada capítulo (anunciados pelo Catálogo ao abrir a mesa): Faísca (fim do 3: atordoa
   35%), Sombra (fim do 4: próximo golpe -40%), Vento (fim do 5: corte; 40% de dispersar o preparado), Pólvora (fim do 6:
   fogo + explosão 30% em todos), Canto (fim do 7: distrai e cura 4% o grupo), Céu (fim do 9: luz; limpa quem lança).
   Somados a Brasa, Geada, Seiva, Fuligem, Areia, Sal, Âmbar = 13. Véus próprios para cada um.
 - FUSÕES NOVAS (selos na Papelaria): Estouro (brasa+pólvora), Tempestade (faísca+geada), Breu (sombra+vento), Aurora
   (canto+céu), Cantiga (canto+seiva).
 - Migração da v91 (que tinha Eco/Maré/Lança/Coro como formas): Gm.v92.

v93 — SUPER DA FORMA HUMANA: VÃO DE DENTES (super_humano.js, pedido do usuário: "no mesmo estilo de magia espacial que a
 forma de baú, mas com o aro"): o aro traça um círculo no ar que vira FENDA; ele some, sai de fendas dos dois lados de
 cada inimigo (2 dentadas de 0.8, corte, quebra 1), e no fim a silhueta GIGANTE do baú que ele é (arcaAtualImg) fecha a
 tampa sobre a fileira toda (1.2, quebra +2, crítico). Volta pela fenda. Mais fraco que o Engolir o Mundo (4.2) num alvo
 só, melhor contra grupos. trocarForma troca super/superNm/superDesc/superTgt e devolve ao voltar a ser baú.

v94b — CONSERTOS DO GRIMÓRIO (relato do usuário): (1) o traçado do anel não andava no celular: o sentido só era decidido
 com um salto de >4° num único quadro, e o toque gira 1-3° por quadro; agora o giro ACUMULA até 6° para decidir o sentido,
 começa de QUALQUER ponto e vale nos DOIS sentidos. (2) a descrição de páginas longas cobria a lista (o texto é outra
 camada e vazava por cima): core.list agora põe a descrição embaixo da lista e, se não couber, vira páginas
 (troca sozinha ou com esquerda/direita, "< 1/2 >"); rótulos longos da lista são cortados com ".." antes do valor da direita.

v96 — LEITURA MAIS FUNDA (leitura2.js; pedido do usuário para a moça dar vantagens de verdade): com c9Leitura, o inimigo
 LIDO (1) MOSTRA A MIRA (olho âmbar nele, setinha âmbar sobre o aliado; foeTarget obedece à mira prevista, a provocação
 ainda manda mais), (2) o anel dele vem 35% mais devagar e sem pressa (somado ao anel mais largo da mecanicas9), e (3)
 qualquer inimigo que começa a PREPARAR golpe fica LIDO sozinho e ela avisa ("!" piscando sobre o olho). Na T2 todas as
 defesas são variações do anel, então a leitura vale para todas. T3: ícone do TIPO de golpe quando houver defesas diferentes.

v98 — ESPAÇOS DE JOGO + HERANÇA PARA A T3 (saves.js; pedido do usuário): 3 espaços de save (espaço 1 = a chave antiga
 'renasci_t2_v1', nada se perde; 2 e 3 = 'renasci_t2_s2/s3'; o espaço em uso fica em 'renasci_t2_slot'). Tela inicial:
 lista "Espaços de jogo" (nome, capítulo, tempo) -> continuar / começar de novo (com confirmação). Menu: "Espaços de jogo"
 copia o ÚLTIMO SAVE do espaço em uso para outro (não é salvar em qualquer lugar) ou apaga um espaço.
 HERANÇA T2->T3: com c10Fim, todo save2 grava 'renasci_heranca2' = { v:2, name, t1 (a herança da T1 inteira), species,
 evo3, evo7, evoLume, nomeMoca, poder, lv, tempo, dia, escolhas {apagar, beijo, cancao, lumeHeart, ritaViuRosto, vila},
 magia {elems, forms, mods, fus}, pilares (boatos ouvidos), lembrancas (devolvidas), cobres, flags (todas) }. Menu
 "Herança (T3)" mostra/copia o código RCB-H2.<base64 json> para outro aparelho. A T3 deve aceitar RCB-H2 (e RCB-H1/RCB1
 de quem pulou a T2), como a T2 faz com a T1.
