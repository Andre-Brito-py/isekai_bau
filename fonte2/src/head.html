  8. OS OITO PILARES (o baú entra na OITAVA CADEIRA; ver a seção própria).

 MAPA DA TEMPORADA: 10 CAPÍTULOS (pedido do usuário: "pelo menos nove a dez capítulos, já que o primeiro é bem
 curto"). Meta: 1h-1h30 de história por capítulo (o Cap. 1 é o prólogo curto), 12-15 h no total com o opcional.
 Os capítulos grandes têm 2 partes. A escalada do Vesper (bíblia da T1) foi esticada para caber em 10:
  1. A SUPERFÍCIE (feito) — prólogo: estrada, Espantalho do pedágio. Vesper ainda não aparece.
  2. VELHÁGUA (feito) — a cidade que afunda, Dona Badalada. ESCALADA 1: Vesper benfeitor (Marco, convite).

     abre a ENFERMARIA na base; Jorge a GARAGEM. Gancho: um Pavio de Candeia tem o caderno preto... de outra pessoa?
     (não: tem uma PÁGINA arrancada do caderno, com o nome da filha riscado mil vezes: LÍVIA.)
  5. O CADERNO PRETO (2 partes) — ESCALADA 3, a REVELAÇÃO no meio da temporada: invadir a Acendedoria (escritório
     do Acendedor-Mor, torre de vidro) atrás do caderno; Vesper os recebe para um chá, não nega nada e explica com

     QUASE aceita (a cena mais difícil). Eles saem livres: ele não precisa prender ninguém. Agora são procurados.
  6. A CIDADE DOS PAVIOS — fugitivos em Auren: Pavios nas zonas seguras (Marcos vigiados), cartazes novos; aliados:

 10. O FAROL DE CEM INVERNOS (feito; 2 partes) — ESCALADA 5: o Farol acende por uma noite; a IRONIA FINAL (Lívia); escolha

 SAVE AUTOMÁTICO E GAME OVER (autosave.js, pedido do usuário): salva nos Marcos, nos marcos da história (save2 nas
 cenas) e ao ENTRAR NUM MAPA se já passaram 4 min de jogo desde o último save (nunca em luta). Cada save mostra um
 bauzinho discreto com três pontinhos no canto inferior esquerdo (~2,5 s). GAME OVER TEM PUNIÇÃO: volta ao último
 save (perde XP, cobres, itens e progresso feitos depois). Contra CHEFE: "Tentar de novo" na hora, pagando 20% dos
 cobres. Regra: não espalhar save2 demais nas cenas novas (só fim de cena importante, chefe vencido, capítulo).
 ÂMBAR NA SUPERFÍCIE (furo apontado pelo usuário: "âmbar é da Coroa", mas o grupo tem e o Bazar vende frascos):
 ÂMBAR BRUTO é monopólio da Coroa (contrabando dá prisão). O único permitido é o FRASCO DE FARMÁCIA: diluído, um
 gole, com SELO da Coroa, vendido com imposto em bazares e boticas ("a Coroa proíbe e vende de volta"). Os frascos
 que o baú trouxe da masmorra NÃO têm selo: ninguém abre a tampa. Gancho (Caps. 6-7): o âmbar de farmácia novo, dos
 últimos meses, vem dos potes do Descanso e dos Pavios; quem souber o gosto percebe ("esse tem gosto de saudade").
 MENU CIRCULAR DE BATALHA (radial.js, pedido do usuário: a volta do menu circular, "o mais bonito possível"):
 medalhões num anel em volta de quem está na vez; o anel GIRA com mola para trazer o escolhido para a frente (lado
 dos inimigos); halo escuro com furo, aros com marcas de runa girando em sentidos opostos, arco de TENSÃO no aro de
 fora (cheio = SUPER pronto, pisca dourado), ponteiro de luz até o escolhido, medalhão escolhido maior com aro na cor
 do personagem e brilho que respira, SUPER cintilando, indisponível apagado; fita com o nome e setinhas; "Vez de X".
 Cima/esquerda = anterior, baixo/direita = próximo. Técnicas/Runas/Itens continuam na lista da direita.
 MAGIA QUE VALE A PENA (magia.js, pedido do usuário: caminhos mágicos dão MAIS DANO e são MENOS TANQUE):
 crescimento por papel (por poder = 3,3 níveis): baú mágico (linha arcana ou Escriba) PV+9 ATQ+1,2 MAG+3,2 DEF+0,6;
 baú de ferro (ou Farol) PV+17 ATQ+2,6 MAG+1,2 DEF+1,4; Lume PV+9 MAG+2,8; Rita PV+12 ATQ+2,6 DEF+1,3. Dano mágico do
 grupo +1,5% por nível, e o caminho mágico do baú +20% em cima. REGRA PARA O FUTURO: feitiços novos do baú (Grimório,
 fusões, Runa de Gatilho, 2ª evolução) devem bater MAIS que o físico na fraqueza; o físico é o seguro (sem PM,
 aguenta). Todo golpe de luz/feitiço passa { mag: true }. Robô (Cap. 4, Relógio): Escriba arcano vence em 138 s
 com o baú caindo a 21%; Farol de ferro vence em 168 s com o baú no mínimo em 52%. É o perfil pedido.
 MAGIA ESPACIAL É RARÍSSIMA (pedido do usuário): dobrar o espaço é a mais difícil das artes rúnicas; menos de dez
 pessoas na história registrada conseguiram; magos da Coroa estudam a vida inteira sem dobrar uma caixa de fósforos.
 Um MÍMICO conseguir (por acidente, com um pingo de tinta) é absurdo e perigoso: o grupo esconde a base. Usar isso:
 quem descobre reage com espanto ou cobiça (a Iolanda desconfia; o Vesper, se souber, vai querer; na T3 há quem caça
 dobradores de espaço). Cada coisa nova da base (cômodos, a magia espacial em batalha) deve ser tratada como proeza.
 O QUE SE APRENDE POR NÍVEL (tecnicas_nv.js, pedido do usuário: "subir de nível deve ser bem importante"):
 técnicas nos níveis 5/9/13/17/22/27 e passivas em 10/20/30, cada técnica com animação própria.

   RITA: Investida (20T, empurra a vez), Escudo Erguido (15T leve, protege um aliado), Lança Atravessada (30T, 2

 Anúncio: na tela de vitória ("TÉCNICA!") e em falas depois da luta (G.aprendeu guarda o que já foi anunciado).
 Correção junto: dash() recebe deslocamento RELATIVO (a Estocada e a Lança de Tampa iam para o lado errado).

 O GRUPO (PARTY) MUDA AO LONGO DA HISTÓRIA (pedido do usuário): conforme mais personagens combatentes aparecerem, a

 Cada capítulo: região nova, mecânica nova, 2-3 inimigos, mini-chefe e chefe com animação de ataque caprichada, falas

 EMBELEZAMENTO COM VIDA EM TODOS OS MAPAS (REGRA FIXA, pedido do usuário: "deixe registrado para que todos os mapas
 tenham esse tratamento de embelezamento com vida"). Todo mapa novo ou refeito (cidade, vila, estrada, interior, masmorra)
 segue o padrão das cidades orgânicas, cada um num ESTILO PRÓPRIO que combine com o lugar:
  1. GEOGRAFIA: nada de retângulo-beco. Espaços abertos, fachadas/paredes em profundidades e alturas diferentes, recuos,
     becos que desembocam em largos, curvas (rios, canais, caminhos), formas orgânicas (blob) quando for natureza ou ruína.
     Lugares planejados (avenidas, praças nobres) podem ser simétricos, mas espaçosos.
  2. DETALHES: árvores/quintais entre casas, canteiros, bancos, barracas, caixotes, barris, varais, chaminés, postes,
     enfeites próprios do lugar (vitórias-régias, relógio afundado, píeres...). Sempre pixel art no mesmo estilo.
  3. VIDA (vida.js, VIDA_CFG): todo mapa novo entra na configuração com bichos e magia que façam sentido no lugar
     (pombos/corvos que voam quando o grupo chega perto, gatos em telhados e muretas, borboletas de dia, vaga-lumes de
     âmbar de noite/no escuro, cartas voadoras nas cidades, peixes na água, bandos no céu; em masmorras, criaturinhas
     e luzes adequadas ao tema).
  4. PLACAS: tabuleta com ícone nos prédios onde se entra (TABULETAS) e nome do lugar perto das entradas (automático).
  5. DIA E NOITE: o mapa muda de noite (luzes, vaga-lumes, quem dorme) e tem pelo menos uma coisa que só se faz em certa hora.
  6. TÉCNICA: posições todas em POS (nada fixo no código), ligações por gatilho em ligaExtra() (mapa.js), validação no
     script do mapa, screenshots de dia e de noite antes de publicar; missões novas em missoes() e DIARIO.
 ESCALA (REGRA FIXA, pedido do usuário: "sempre respeitar o tamanho dos personagens e objetos"):
 - 1 metro = ~29 px. Adulto = 44-53 px de altura (Lume, baixinha: 48; Rita: 53; Seu Jorge: 48). Criança: ~32-36 px.
 - O Baú (forma de baú) é BEM menor que um adulto: ~0,55-0,6 (~28 px de altura na batalha, ao lado de humanos de
   48 px); no mapa, 16 px (um terço do adulto), como na T1. Ajustado a pedido do usuário ("o baú tá muito grande").
 - Objetos no mesmo plano dos personagens seguem a escala real: porta 2,1 m = ~60 px; ônibus 3,2 m de altura =
   ~92 px e 12 m de comprimento (não cabe inteiro: mostrar em parte, saindo da borda); carroça ~50 px; banco ~14 px
   de assento; poste de luz ~120 px; casa térrea ~90 px. Animais: corvo comum ~10 px (monstros podem ser maiores,
   mas com motivo: o Corvo-Cartaz é um bicho de papel do tamanho de um cachorro, ~28 px).
 - Chefes podem ser bem maiores que o grupo (o Espantalho, num poste, tem ~3,8 m = 112 px), mas nunca menores que
   faria sentido. Ao pôr algo novo em cena, comparar com o adulto de 48 px antes de desenhar.
 - Coisas ao FUNDO (cidade, ponte distante) podem ser menores por perspectiva; no MESMO PLANO, nunca.
 ARTE: TUDO EM PIXEL ART (pedido do usuário). Chefes com nível de detalhe bem maior que na T1: pintor próprio
 (art2.js, classe Pix) com sombreamento por volume, pontilhado ordenado entre tons, rampas de 5 tons com sombra
 puxada para o roxo e luz para o amarelo, contorno seletivo. Personagens da T1 vêm da arte herdada
 (build/heranca_arte.json, exportada da T1 rodando).

 COMBATE (battle2.js) — TEMPO ATIVO (decidido com o usuário em 21/11/2026: nem turnos puros nem tempo real; híbrido)
 - Linha do tempo no topo com a ordem prevista; barras de vez enchem em tempo real pela velocidade.
 - Roda de comandos em ícones em volta de quem age. Modo ATIVO (padrão): com a roda aberta os inimigos seguem a 25%
   e podem interromper; modo ESPERA: tudo para (botão MENU alterna). Listas e mira sempre param o tempo.
 - Acerto no tempo nos ataques (anel amarelo): certeiro = x1.5. Defesa em anel: perfeito = x0.12 de dano,
   contra-ataque e +9 Tensão; bom = x0.5.
 - Escudo + fraquezas (fogo, gelo, luz, corte, mordida), descobertas ao acertar ou com a Vela-guia da Lume.
   Escudo zerado = QUEBRA: perde a vez, dano x2, e CANCELA o golpe preparado ("!" vermelho na linha do tempo).
 - Tensão (barra vertical à esquerda): técnicas, duplas (50) e SUPER (100) com cena de corte.
 - Peso das ações: leve devolve a vez cedo, pesada atrasa. Fileiras frente/trás.
 - Grupo do Cap. 1: Baú (Morder; runas Brasa/Geada/Seiva; Guardar + assinatura da linha: Baluarte no Ferro, Eco de
   Runa no Arcano; Super Engolir o Mundo), Lume humana (Faísca de longe; Canção, Vela-guia; Super Lustre de Mil
   Velas), Rita (Lança em dois golpes; Estocada, Provocar; Super Carga da Escudeira).
   Duplas: Canção-Escudo (Baú+Lume; mais forte com lume.coracao >= 8), Lança de Tampa (Baú+Rita), Lança Acesa
   (Lume+Rita).

 EQUIPAMENTOS DAS FORMAS HUMANAS (pedido do usuário, 21/11/2026)
 - Só as FORMAS HUMANAS usam equipamento (Baú humano, Lume humana, Rita e outros humanos). As formas MONSTRO (o baú,
   o lustre) não equipam nada, mas têm vantagens próprias. Trocar de forma na luta é uma ação leve.
 - Espaços: ARMA/FOCO, ROUPA e AMULETO. Conseguir: lojas das zonas seguras, baús no mapa, missões, chefes, e a FORJA
   da Rita na base (melhorar e combinar). Moeda comum: cobres; âmbar é raro e político (não se vende à toa).
 - O equipamento aparece no sprite de batalha da forma humana (camada por cima), em pixel art e na escala certa.
 - Todo item tem vantagem e desvantagem. Alguns são "amaldiçoados": muito fortes, com um preço chato.
 - BAÚ, forma monstro: muita vida e DEF, Morder, Guardar aliados, Engolir (Super); ações pesadas, sem equipamento,
   e na cidade chama atenção (sobe a suspeita). Forma humana: mais VEL e MAG/PM, runas mais baratas, usa equipamento,
   passa despercebido na cidade; mas é frágil (DEF e vida bem menores) e não morde nem guarda.
 - LUME, forma humana (de dia): equipa, canta melhor (Cantigas mais fortes), ataques com o item na mão. Forma lustre
   (à noite, ou com um item que force a troca): sem equipamento, mas luz forte (dano de luz alto, revela fraquezas
   sem custo, ilumina mapas escuros); fraca a vento e água, e não cura tão bem.
 - Exemplos para o Cap. 2 em diante:
   Baú humano: Luvas de Carregador (+ATQ; o soco quebra 2 de escudo; -1 de VEL) · Casaco de Feira (+DEF; ações viram
   pesadas) · Óculos de Bibliotecário (mostra fraquezas; -ATQ) · Botas da Ponte (+VEL; ações leves devolvem mais a vez;
   -vida) · Chave Mestra (abre baús trancados no mapa; na luta, "Destrancar" tira 1 de escudo de qualquer inimigo).
   Lume humana: Microfone de Lata (Cantigas atingem o grupo todo; custam o dobro de PM) · Xale de Velas (Vela Protetora
   dura mais; -VEL) · Sapatilha de Palco (esquiva de golpes rápidos; -DEF) · Fone Remendado (só com a herança lume.fone:
   curas +10%).
   Rita: Lança do Pedágio (troféu do Cap. 1: +corte; a Estocada quebra 3) · Escudo de Tampa (Provocar dura mais; -VEL).
   Amaldiçoado: Anel do Pedágio (+30% de dano; cada ação cobra 5 de Tensão).
 - Conjuntos: duas peças do mesmo conjunto dão um bônus extra (ex.: "Trupe da Feira" para a Lume).

 A LUME HUMANA NA T2: de dia o sol acende o âmbar do lustre e ela "lembra que era gente" (fica humana); à noite
 volta a ser lustre. (Regra para cenas noturnas e para a base.)

 CAPÍTULO 1 — A PONTE DO PEDÁGIO (roteiro)
 - Três dias depois da tampa. O 31 desce a serra rumo a Velhágua (que afunda devagar no rio).
 - Pedágio que nunca existiu, cartazes de PROCURADO com o desenho do baú (recompensa: 300 frascos de âmbar; reação
   da Lume muda com o Renome herdado). Corvos-Cartaz (tutorial do combate novo).
 - O papel sobe pelo poste e vira o ESPANTALHO DO PEDÁGIO (chefe, 3 fases): 1) casaco de cartazes, fraco a fogo e
   corte, levanta a cancela (golpe preparado, cancelável pela quebra), chuva de moedas, chama corvos; 2) a lanterna
   acende: fraco a gelo e mordida, Bafo de Lanterna (queima); 3) cartazes queimados, coração de âmbar exposto: fraco
   só a luz, Taxa do Pedágio (rouba Tensão e se cura), mais rápido.
 - Depois: o coração é ÂMBAR com a lembrança do velho que cobrava pedágio ali há 40 anos. "A masmorra tá subindo.
   Ou alguém tá trazendo ela pra cima." Cartaz de BEM-VINDOS com o "BEM" riscado.
 - O Cap. 1 termina na cabeceira da ponte. Velhágua virou o Cap. 2.

 CAPÍTULO 2 — VELHÁGUA, A CIDADE QUE AFUNDA (roteiro)
 - TOM: cidade simpática e cansada. Todo mundo carrega móveis escada acima: "Velhágua desce um degrau por ano".
   Só que nesta semana desceu TRÊS. E à noite o sino da torre toca sozinho, debaixo d'água.
 - POR QUE AFUNDA (a verdade, revelada aos poucos): há cem anos o PRIMEIRO SINO da cidade, a Dona Badalada, caiu no rio
   numa cheia. Ela tocou todos os casamentos, batizados e enterros: é feita de lembrança. Quando a Coroa abriu MINAS
   DE ÂMBAR debaixo da cidade (âmbar = lembrança lida), as minas sugaram as memórias do fundo do rio, e o sino,
   faminto, virou a ÂNCORA-MÃE: agarra as estacas das casas e puxa a cidade para baixo "para não esquecer ninguém".
   (Liga com o tema da temporada: a política do âmbar; e com o Acendedor-Mor, que compra âmbar dessas minas.)
 - MAPAS: Cais da Ponte (chegada; o 31 estaciona; Bazar da Dona Graça) -> Praça do Sino (torre torta, Taverna do
   Remo Torto, Posto da Guilda, casa do Seu Tobias, escadaria da Igreja Afundada) -> interiores -> BAIRRO AFOGADO
   (Rua Submersa, Mercado Afundado, Poço do Sino) -> chefe.
 - MECÂNICA NOVA 1, DISFARCE DE BAGAGEM: a Guilda tem cartazes do baú. Na cidade, Caçadores patrulham; quando um
   deles OLHA (aviso "!" e cone de visão), o baú precisa ficar PARADO (é só bagagem). Se for pego andando, sobe a
   SUSPEITA; cheia = os Caçadores atacam (luta) e ela zera. Humor: "É bagagem." "Bagagem não pisca." "...Pisca sim."
 - MECÂNICA NOVA 2, BOIAR: no Bairro Afogado o baú BOIA na água. A Lume e a Rita ENTRAM no baú ("é maior por
   dentro", primeira pista da Runa do Vão e da base) e saem em terra firme. CORRENTEZAS empurram o baú: as rotas são
   o quebra-cabeça da masmorra. Caixotes que boiam e tábuas soltas abrem atalhos.
 - INIMIGOS: Lambe-Lodo (sanguessuga, rouba PM), Caranguejo-Telha (casco de telha, escudo alto, fraco a mordida e
   gelo), Sapo-Sino (coaxa e badala: deixa TONTO, atrasando a vez), Caçador da Guilda (humano, na cidade).
 - CHEFE: A ÂNCORA-MÃE (sino de igreja como casco de ermitão, pernas de corrente, coração de âmbar escuro).
   Fase 1 Casco: o sino fechado; Badalada (todos TONTOS); MARÉ: a cada 3 vezes dela a água sobe e quem está na
   FRENTE fica lento (trocar de FILEIRA é uma ação leve). Fase 2 Correntes: prende um aliado (ele não age) até
   alguém quebrar a CORRENTE (alvo próprio). Fase 3 Lembrança: o sino abre e chora as lembranças da cidade; se a
   Lume CANTAR nessa fase, os golpes dela enfraquecem (e o final muda uma fala).
 - MISSÕES: Carta para o andar de cima (Seu Tobias -> a filha Marina, no telhado; recompensa: Xale de Velas);
   O barquinho do Pedrinho (achar no Mercado Afundado; Pena de Fênix? e cobres); O nome do Pavio (um acendedor
   gentil que não lembra o próprio nome; a plaquinha dele está no fundo: devolve uma lembrança. PISTA do Acendedor).
 - EQUIPAMENTOS ESTREIAM: Bazar da Dona Graça (cobres). Lança do Pedágio (troféu do Cap. 1, já começa na mochila).
 - FINAL: o sino volta para a torre; a cidade para de afundar. Ao entardecer chega o ACENDEDOR-MOR com os Pavios
   para acender os postes novos da Coroa. Ele elogia a canção da Lume, dá o primeiro MARCO de viagem e convida
   para o FESTIVAL DA LUZ na capital (gancho do Cap. 3). Cai a noite: a Lume volta a ser lustre pela primeira vez
   na superfície ("de noite eu volto a ser isso") e ele diz, gentil: "Ninguém devia ter medo do escuro, moça."
   (Pista: ele anota o nome do Pavio da missão no caderno preto.)
 - IMPLEMENTADO (t2-0.20): mapas cais/praca/bazar/taverna/tobias/rua1/rua2/poco (maps/cap2maps.py valida tudo);
   Sargento Brás é o mini-chefe (emboscada na escadaria); Marco de Viagem no MENU (viajar entre Marcos visitados).
 - REGRA DOS MORADORES (pedido do usuário): NPC não fica só andando à toa. Cada morador tem uma ROTINA (world2.js,
   e.rotina = [{at, act, t, dir, leva}]): vai até um ponto e FAZ alguma coisa lá, com animação própria (ACT2:
   varrer, pescar, carregar/empilhar caixa, acender poste, tocar sino, varal, regar, limpar balcão, remendar rede,
   beber, cochilar, conversar com balão, brincar, rezar...). Cidade nova = rotinas novas que contem a história dela.
 - JOGO DEITADO (pedido do usuário): celular de lado; a tela ocupa tudo e os controles ficam por cima, nos cantos.
   O MAPA usa a largura toda (W cresce até 520); batalha, cenas e título são quadros 240x240 no centro com o próprio
   quadro desfocado nas laterais. Em pé aparece "Gire o celular". HUD do mapa: canto de cima à direita é dos botões.
 - ESTILO DA INTERFACE (pedido do usuário, referência: Hyper Light Drifter): painéis de vidro escuro translúcido,
   cantos chanfrados, borda fina turquesa (#8fe3d8) com cantoneiras, nomes em etiqueta rosa (#ff7aa8), setas em pixel;
   controles de toque "fantasma" (círculos translúcidos, ícones em pixel); laterais com ladrilho de runas escuro;
   HUD do mapa com vida em segmentos. Nada de caixas pretas com borda branca grossa.
 - BATALHA v3 (pedido: menos caótica, mais intuitiva): campo limpo no meio; cartões do grupo à esquerda (vida em
   segmentos, PM, barrinha de vez), comandos em LISTA à direita (técnicas/runas/itens abrem no mesmo painel, com
   custo e motivo quando não dá), ordem de vez no topo (AGORA + próximos), Tensão em 4 gomos, barra de informação
   embaixo (descrição ou ficha do alvo: vida, escudo, fraquezas). O tempo PAUSA na escolha por padrão (Tempo na
   luta: Pausa/Ativo no MENU do mapa). Nada de roda em volta do personagem.
 - ANIMAÇÃO v2 (pedido: personagens se mexem de verdade em cada golpe): anim2.js transforma os sprites de lado em
   bonecos (inclina, agacha, passada) com a LANÇA da Rita e o BRAÇO da Lume por cima; cada golpe tem coreografia
   (preparo, investida, golpe, acompanhamento, volta). Baú anda aos pulinhos e morde no ar. fx2.js: impacto por
   elemento, soco de câmera, rastro, morte que se desfaz em pixels. A Rita da T1 já olha para a DIREITA (não virar).
 - AVALIAR volta como comando do baú (ação leve, sem custo): lente do Catálogo varre o inimigo e lê a ficha.
 - DIA E NOITE (tempo2.js): 1 min de jogo por segundo no mapa (dia = 24 min). Noite (19h-5h): a Lume vira LUSTRE
   (mais MAG/VEL/PM, Chama-Vela e Chuva de Cera, menos PV, sem equipamento), céu escuro com luzes (postes acendem
   ao entardecer), crianças/trabalhadores dormem, Caçadores veem menos e levam lanterna, bichos ATQ +10%. Marco:
   descansar até a manhã ou a noite. Primeira noite = cena da forma de lustre (o final do Cap. 2 se adapta).
 - ECONOMIA (economia2.js): o grupo chega a Velhágua SEM UM VINTÉM (cena na chegada: Rita e Lume explicam os
   jeitos de ganhar). Cobres vêm de: lutas; MATERIAIS que os bichos deixam (Lodo, Telha, Sininho, Apito, Bronze...)
   vendidos no Bazar; QUADRO DE PEDIDOS da Guilda na taverna (a Rita aceita com a licença de escudeira); a LUME
   CANTANDO na fonte da praça de noite (minijogo de ritmo, 1x por noite); a CARTA DO TIAGO no Bazar (+60).
   TIAGO (o ex-cobrador, Herói nº 30) está na capital, tratado como estátua; figurinhas dele pela cidade; a carta
   avisa: "cuidado com quem é gentil demais aqui em cima" (pista do vilão, sem revelar).
 - TAVERNA VIVA (taverna2.js): salão 20x13, balcão, cozinha, lareira, 6 mesas com comida, fregueses comendo/
   brindando/rindo, garçons Quincas e Bia servindo com bandeja; de noite: bardo Seu Lúcio, marujo, caçador de folga.
 - MONSTRO CHAMA ATENÇÃO (atencao2.js): moradores de frente e perto veem a mala andar, levam susto e apontam (sobe a
   suspeita se houver Caçador). De noite o lustre BRILHA: Caçadores veem de longe; a Rita cobre a Lume com um PANO DE
   MESA (discreta, mas escura). Cobrir/descobrir pelo MENU.
 - POR QUE AS MAGIAS SUMIRAM (forma2.js, cena logo após a chegada): as runas do Grimório foram escritas com ÂMBAR DA
   MASMORRA; na superfície o âmbar "dorme" (e o que existe é da Coroa, contrabando). As páginas ficaram EM BRANCO, não
   perdidas. Só restaram as runas GRAVADAS NA TAMPA: Brasa, Geada, Seiva e a RUNA DO ROSTO. Gancho do Cap. 3: as
   anotações da Ofélia citam uma TINTA DE SUPERFÍCIE (sem âmbar) que acorda as runas: volta do Grimório, fusões e
   evoluções no Cap. 3.
 - RUNA DO ROSTO / FORMA HUMANA NO MAPA (forma2.js): B no mapa vira gente / volta a baú. A forma é a MESMA do fim da T1
   (arte do usuário por linha de 4º grau, copiada para arte_rosto.js: corpo e retrato; Vazio translúcido). Fala com o
   retrato humano pelo WHO 'rosto'. (FIG_ROSTO/humano() fica só como reserva se faltar a arte.) Sem âmbar, a runa queima "memória quente": FÔLEGO 100, -1.5 por passo e
   -0.4/s parado; como baú volta +1.2/s; Marco enche. Precisa de 25 para vestir. De rosto firme, Caçadores e moradores
   NÃO desconfiam. Abaixo de 15 o rosto DERRETE (pisca, escorre) e o disfarce falha. No zero volta a baú na hora; quem
   estiver olhando vê a troca (sobe suspeita). Água desfaz (gente afunda, baú boia). Luta sempre começa como baú: a
   TROCA DE FORMA EM BATALHA (humano ágil x baú pesado, ação leve) fica para o Cap. 3.
 - A RITA VÊ O ROSTO (forma2.js, momentoRita, logo depois da primeira transformação; em save antigo, na próxima vez que
   ele vestir o rosto com a Rita junto): close-up por cima do mapa, primeiro o REFLEXO NA JANELA DO 31 à noite (o ângulo de
   quem sentava duas fileiras à frente), depois o rosto de dia. Ela preenche com a memória dela o que ele esqueceu: os
   riscos de borracha do rosto somem enquanto ela fala (G.flags.rostoLembrado; o Catálogo registra "fonte da memória:
   externa"). Se a promessa do jogo 1 valeu (esc.rita): "Quando você arranjar um rosto, me procura" -> o PASTEL continua
   por conta dela (G.flags.pastelRita: pagar a cena do pastel quando houver cobres sobrando, Cap. 3, ligada à cozinha do
   Seu Ozório na base). Sem promessa: "amigos de ônibus". A Lume reage de lado (gaivota). Detalhes do rosto inventados
   pela Rita (pinta, sobrancelha que sobe dormindo) agora são canônicos.
 - PASSE VISUAL "HLD" NO MAPA (hld2.js, a partir de um vídeo de Hyper Light Drifter enviado pelo usuário; só o ESTILO,
   nada copiado): CHÃO com rampas pastéis de 5 tons por material (calçamento lavanda, tábuas salmão, grama verde-água,
   lodo verde apagado) e ruído achatado; grama derramando em degraus sobre o caminho; tufos claros e pontinhos; sombra
   chapada ao pé do muro e silhueta-sombra dos objetos para baixo/direita. AR: partículas quadradas boiando (vaga-lumes de
   noite), vinheta, salas pequenas num vazio escuro com brilho de cor. MOVIMENTO: câmera com folga que olha para onde se
   anda, poeira ao arrancar/virar/pousar, baú que estica no ar e achata ao pousar e inclina na direção, sombra oval que
   encolhe no pulo, CAPA/cachecol da forma humana esvoaçando com atraso (corrente de 10 pontos). PERSONAGENS E OBJETOS DO
   MAPA: pintados CHAPADOS (sem pontilhado; a arte de batalha mantém o pontilhado) e com GRADE HLD (luz em degraus, sombra
   puxando para violeta, luz para o quente, contorno violeta-escuro, luz de um lado só: borda esquerda clara, direita
   escura). Regra: arte nova de mapa já nasce nesse estilo.
   REDESENHO (2º vídeo): gerador de moradores refeito (humanoFrame em hld2.js): silhueta em A, cabeça grande, rosto só
   com dois olhos, 3 faixas chapadas de cor, pernas curtas, CAPA opcional (o.cape), cabelo 'rabo'. PROTAGONISTAS (Rita,
   Lume, forma humana) e Seu Jorge MANTÊM a arte original do usuário/T1, só com a grade de cor HLD (o redesenho pelo
   gerador ficou "palitinho" e foi desfeito a pedido do usuário; FIG_GRUPO fica de reserva).
   Telhados vistos de cima como laje chapada com borda grossa e respiro (casaArt). Batalha ainda no estilo antigo.
   MORADORES MAIS ENCORPADOS: ombros, cintura, barra; gola, cinto com fivela, botões, mangas de 2 px com punho, botas
   com brilho; rosto com olhos de 2 px, sobrancelha, sombra do nariz e bochecha; mecha de luz no cabelo; acessório
   por pessoa (cachecol, bolsa a tiracolo ou pingente).
 - CÂMERA DE LONGE NO MAPA (core/cap1): ZOOM_MUNDO = 1.5. O mundo é desenhado num quadro 1,5x maior (WBIG) e esticado na
   tela; o texto do mundo entra na fila dividido por TXZ; o painel do mapa (HUD) e as janelas ficam no tamanho normal.
   TELA CHEIA: o zoom de cada mapa é o mais longe possível até 1,5 SEM passar do tamanho do mapa (sem faixa preta);
   sala pequena (taverna) chega mais perto e a câmera rola. H agora é 'let' (muda só durante o desenho do mapa).
 - REGRA DE CHEFE (pedido do usuário, vale para todo chefe e mini-chefe daqui em diante): TODO golpe de chefe tem
   ANIMAÇÃO DE ATAQUE bem feita, que também serve de TEMPO para a defesa. Implementado em fx3.js (BT.golpe): enquanto o
   anel fecha, o chefe ARMA (recua, treme, brilha, "!" em cima) e AVANÇA, e o golpe chega no alvo exatamente quando o
   anel encosta; golpe à distância (luz, sopro) vira projétil que chega no mesmo instante. Chefes novos podem (e devem)
   ter coreografia própria além dessa base.
 - ANEL DE AÇÃO (fx3.js): alvo com disco escuro, faixa verde (perfeito) e azul (bom); anel grosso com contorno escuro que
   muda de cor dentro da janela; botão A pulsando na hora certa; resultado grande (PERFEITO!/BOM/FALHOU).
 - MAGIAS COM ANIMAÇÃO DE VERDADE (fx3.js): projétil por elemento (bola de fogo com chamas, cristal de gelo girando,
   semente de seiva, bola de fuligem), impactos (explosão de chamas e brasas, espinhos de gelo que crescem e estilhaçam
   com flocos, vinhas e folhas, nuvem de fumaça com estrelinhas de tontura, vapor), ONDA que atravessa o campo, VÉUS
   próprios (chamas em espiral, couraça de placas de gelo, coluna de luz verde com folhas). Vale para as runas antigas e
   para as páginas do Grimório.
 - AVALIAR (anim2.js): NÃO gasta a vez do baú; uma vez por vez (BT._avalFeito). Animação de ESCÂNER: feixe em leque da
   tampa até o alvo, grade e linha de varredura, leituras em hexadecimal, selo ANALISADO.
 - TELA DE STATUS (status3.js; MENU > Grupo): ficha por personagem com retrato grande em pedestal de runas, função,
   vida/PM, atributos com barras, equipamento por encaixe e habilidades; < > troca de personagem.
 - O chefe difícil era o ESPANTALHO DO PEDÁGIO (Cap. 1 da T2): PV 2300->1750, ATQ 22->19, Cancelada 2.5/2.9->1.8/2.1,
   Golpe de Cancela 1.25->1.1, moedas e bafo mais fracos e como golpe à distância. Bot 60%: vence com ~30% de vida;
   45%: vence com ~35%. Rainha levemente ajustada (PV 1550, ATQ 21, 1 filhote por vez) e com ARTE NOVA de chefe
   (rainhaArt: quatro asas, olhos de três anéis, nervuras, franja, tórax peludo com gola, antenas plumosas, coroa).
   VOO GRACIOSO (fx3.js): mariposas e Rainha batem as asas em 6 quadros (BATE6: abre, desce devagar, fecha, sobe; as
   pontas sobem e descem) e quem tem 'paira' sobe e desce no ritmo das asas e balança de leve de lado.
 CAPÍTULO 3 — O FESTIVAL DA LUZ (roteiro; dividido em 2 partes a pedido do usuário)
 - PARTE 1 (IMPLEMENTADA, cap3.js + grimorio3.js + inimigos3.js + arte_cap3.js + maps/cap3maps.py -> mapas3.js):
   ESTRADA DOS LAMPIÕES (o 31 quebra a correia; postes apagados; mariposas comem luz; ACENDER POSTE com a Lume atrai
   as mariposas da redondeza para longe do caminho; Bandoleiros afanam cobres; mini-chefe MARIPOSA-RAINHA: come luz,
   chama filhas, na metade come a lanterna do poste e ACENDE: fraquezas mudam para gelo/corte, Sopro de Luz preparado)
   -> AUREN, BAIRRO BAIXO (capital acesa ao meio-dia; Jorge chega com a correia trocada por Pavios sem nome; Caçadores;
   feira, poeta, velha que lembra o Inverno Escuro) -> PAPELARIA PENA & FULIGEM (Dona Iolanda lê a anotação da Ofélia:
   tinta = FULIGEM DE POSTE (Tico, limpa-chaminé; o irmão dele, DITO, virou Pavio e não o reconhece) + ÓLEO DE LAMPARINA
   (um Pavio dá; "óleo bom é óleo de lembrança") + LÁGRIMA DE QUEM ESCREVE (a LUME tenta terminar a música do 31, para
   no verso de sempre, "...e aí teve a curva", chora no tinteiro; a Rita sabia a música de cor)) -> O GRIMÓRIO ACORDA
   (páginas = ELEMENTO + FORMA; elemento novo FULIGEM; FUSÕES descobertas com anotações da Ofélia nas margens) -> o
   pingo de tinta reativa a RUNA DO VÃO no fundo da tampa: INTERIOR DO BAÚ (a BASE: vela que a Lume acende, a MEIA
   misteriosa, estante do Grimório, cama, canto da forja sem bigorna, quadro vazio; entra-se por qualquer Marco) ->
   AVENIDA DO FESTIVAL (noite de abertura, 3 dias depois; sem Caçadores; o PASTEL DA RITA na barraca da Dona Fátima:
   exige a forma humana; com a promessa do jogo 1 ela paga; se a herança perdeu a memória do pastel, o gosto VOLTA)
   -> DISCURSO do Acendedor-Mor (Inverno Escuro, anuncia o FAROL DE CEM INVERNOS para a última noite; a Lume tocada; a
   Rita desconfiada; o Pavio Dito desmaia e diz "bom dia, rapazinho" ao Tico; o conde anota no caderno preto; as luzes
   da cidade piscam como respiração; sopro de fuligem dos bueiros) -> cartão FIM DA PARTE 1.
   GRIMÓRIO (grimorio3.js): Brasa/Geada/Seiva/Fuligem x Dardo/Onda/Véu; 2 elementos = fusão (Vapor, Orvalho, Brasa Viva,
   Fumaça, Geada Negra e o MOFO, que dá errado de propósito); elemento repetido = dobrado. Véus: Manto de Brasa (+30%),
   Couraça, Véu de Fumaça (próximo golpe erra)... MENU > Grimório ou estante da base. G.grim guarda páginas e fusões.
 - PARTE 2 (IMPLEMENTADA, cap3b.js + evolucao3.js + inimigos3b.js + arte_cap3b.js; mapas galerias1/galerias2/fundo):
   bueiro do Bairro Baixo (Tico) -> GALERIAS 1 (escuro: raio de luz 70, lustre 96, Farol +26; brasas e Pavios
   iluminam; BIGORNA para a forja da Rita: Afiar a lança +3 ATQ ou Reforçar o escudo +2 DEF/+10 PV) -> GALERIAS 2
   (prateleiras de lanternas com nomes; o pote do Dito vazio; o VEIO DE ÂMBAR = cena da EVOLUÇÃO) -> FUNDO (chefe
   MÃE-FULIGEM; depois, a lanterna do Dito: ele lembra do Tico por um instante; Rita e Lume desconfiam) -> FIM DO CAP. 3.
   Regra das Galerias: FOGO ALIMENTA FULIGEM (Brasa cura Cinzinha e Mãe). Inimigos: Cinzinha (estoura quando fraca),
   Rato-Pavio (mordida dupla, apaga vela/manto). Mãe-Fuligem: Fornalha preparada a cada 4 vezes (quebre o escudo),
   cospe Cinzinhas, Chuva de Cinzas, Engole a Luz (come Tensão e velas); fase 2 a 50%: fornalha aberta, fraca a
   LUZ/gelo/corte, a luz arranca lembranças presas (popups LEMBR3).
   EVOLUÇÃO (G.evo3 = farol | vao | escriba; G.flags.c3Forma libera TROCAR DE FORMA em batalha, ação leve, 3 vezes):
     FAROL: +34 PV, +4 DEF/MDEF, +2 MAG, +2 ATQ; técnica Farol 35T (grupo leva metade por 3 vezes e cada golpe recebido
       devolve raio de luz 0.6); começa a luta com +15 Tensão.
     VÃO: +4 ATQ, +3 VEL, +14 PV; Guardar Dentro 25T leve (aliado some: próximo golpe erra, vez adianta); físico x1.2.
     ESCRIBA: +7 MAG, +18 PM, +10 PV; Marca de Runa 25T leve (magia no alvo +30% e quebra 1 escudo a mais, 3 vezes);
       magia x1.15, páginas -1 PM, Grimório com 6 páginas.
   BALANCEAMENTO (robô, acerto 0.6, linhas ferro 'arca' e arcano 'vazio', 7 lutas comuns + chefe): todas as
   combinações vencem; vida mínima no chefe entre ~20% e ~45%; nenhuma linha fica para trás (o Escriba, mágico,
   ficou no meio do pacote, de propósito, para não repetir o problema do jogo 1). Mãe-Fuligem final: 4800 PV, ATQ 31 (endurecida a pedido do usuário: luta ~40% mais longa, vida mínima ~15-30%, o robô passou a beber frascos).
 - (plano original da Parte 2, mantido como referência) GALERIAS DE FULIGEM (túneis e chaminés sob a capital; escuro: a luz da Lume importa; Pavios
   trabalhando no escuro; o Dito como missão: devolver uma lembrança) + TROCA DE FORMA EM BATALHA (humano x baú, ação
   leve; forma humana usa equipamento) + a forja da Rita (achar a bigorna) + CHEFE no fundo das Galerias + gancho.
   A EVOLUÇÃO (pedido do usuário: caprichar na história e começar com TRÊS opções), nas Galerias: o âmbar/tinta do
   lugar empurra o baú para uma forma nova da superfície. Três caminhos, cada um com uma memória da Terra como PREÇO
   (diferente para cada um, mostrada antes de escolher):
     1) ARCA-FAROL (luz e âmbar: absorve luz e devolve como golpe; protege o grupo no escuro) — preço: o rosto da mãe
        (sobra a voz). Tema: o mesmo desejo do conde, "ninguém no escuro", pelo outro lado.
     2) ARCA DO VÃO (espaço: guarda um aliado DENTRO para salvá-lo de um golpe, troca posições, "teleporta" a mordida)
        — preço: o caminho de casa (o endereço, o ponto do 31). Tema: a casa agora é o próprio baú.
     3) ARCA-ESCRIBA (tinta: escreve runas NOS inimigos, marcas que explodem; mais páginas no Grimório; ligada à Ofélia)
        — preço: a própria letra/o nome antigo escrito à mão. Tema: quem escreve guarda; quem guarda esquece.
   Cada uma muda o sprite (baú e forma humana), dá técnica própria e muda falas (a Rita, a Lume e o Catálogo reagem).
 SUPER DO BAÚ REFEITO (fx4.js, pedido do usuário: "ele só some e o inimigo é esmagado"; o baú sumia porque o
 dash antigo recebia deslocamento relativo como posição absoluta): carga (ar sugado), salto em arco girando e
 crescendo com rastro, pouso com onda de choque, boca abre num REDEMOINHO do Vão que suga o alvo (chefe resiste),
 tampa bate (quadro de impacto) + 3 mastigadas CRUNCH/CROC/NHAC, cuspe como bala de canhão, impacto e volta.
 CAMINHAR E CORRER NO MAPA (anda.js, pedidos do usuário: Lume e Rita "arrastadas", animação "muito acelerada",
 joystick todo = CORRER e pouco = ANDAR, "bem fluida, com roupas e cabelos balançando", e o baú de rosto sem COSTAS):
 a arte da T1 só tem quadros parados; cada um vira ciclos de 8 quadros gerados por pixel: pernas (tesoura de lado,
 pé levantando de frente/costas), corpo subindo na passagem, tronco inclinado na corrida, e as partes SOLTAS (longe
 do eixo do corpo: cabelo, capa, barra da roupa) numa onda com atraso; parado, o cabelo e a roupa balançam devagar.
 O quadro segue a DISTÂNCIA andada (uma passada por tile). Joystick >= 80% ou teclado corre (7 quadros/tile); menos
 anda (13/tile); seguidores no mesmo ritmo (W2.passoN). Costas do baú de rosto: geradas da arte de frente (costasDe:
 cabeça vira cabelo, peito vira capa lisa com dobras e costura). Personagem novo com arte parada: andaQuadro/paradoQuadro.
 CACHECOL DA FORMA HUMANA (anda.js cachecolCarniceiro, pedido do usuário: "parece capa, e não cachecol"): na linha do
 CARNICEIRO (look 'scarf' na bíblia da T1) a capa vermelha da arte sai; o vermelho fica só no cachecol (volta no
 pescoço + ponta caindo na frente com franja; a outra ponta voa ao vento pelo capaHLD com a mesma cor); o corpo vira
 casaco roxo com mangas, mãos e cinto, com as cores da própria arte. Vale no mapa, nas costas e na luta. As outras
 linhas continuam com a capa/manto da arte original (é o visual delas).
 O BAÚ FALA (pedido do usuário): o protagonista estava quase mudo na T2. Agora tem falas ('me') nas cenas dos Caps.
 1-4, na voz da T1: seco, curto, humor melancólico ("Eu sou um baú."), lembrando a Terra aos pedaços. Escolhas de
 diálogo entre aspas viram fala dita por ele. De rosto, o retrato do diálogo é o rosto. REGRA: toda cena nova dá ao
 baú pelo menos uma ou duas falas suas. Tirinha do super/dupla (cutIn): o baú aparece (retratoCut usa PT('me') ou o
 rosto quando está em forma humana).
 NÍVEL E XP (nivel.js, pedido do usuário: "sistema de lvl e xp, muito importante num RPG"): G.nv[id] = {lv, xp};
 toda vitória dá XP ao grupo (caído ganha metade); xp do inimigo = ENEMY2.xp ou mhp/18 + atk*0,6 (chefe x2);
 próximo nível = 30 + 20*lv. O nível SUBSTITUI o poder por capítulo: 3,3 níveis = 1 poder (grupoAtual), então o
 balanceamento do robô continua valendo. Piso: ao começar um capítulo, ninguém fica abaixo de 1 + poder*3,3 - 1.
 Freio: XP x(1 - 0,2 por nível acima do esperado), de 0,25 a 1,5 (esperado = 1 + (poder+0,8)*3,3). Subir cura 25%
 de vida e PM. TELA DE VITÓRIA refeita (pedido: "fraquinha"): raios girando, VITÓRIA! letra por letra com quique
 numa faixa dourada, confete, cartão com cobres/XP contando, estatísticas com ícones, cada membro com moldura, selo
 de nível e barra de XP com brilho, "SUBIU!" com estrelas, e a NOTA da luta (S/A/B/C) carimbada. Status mostra Nv/XP.
 Níveis esperados: Cap. 2 ~4-7, Cap. 3 ~7-10, Cap. 4 ~10-14, Cap. 5 ~14-17 ... Cap. 10 ~30-34.
 CAPÍTULO 4 — A CASA DOS QUE ESQUECEM (roteiro; 2 partes como o Cap. 3)
 - LUGAR NA ESCALADA DO VILÃO: passo 2, SUSPEITA. Ele "compra o hospital dos pobres" (o do discurso) e a vila vizinha
   APAGA. O jogador acha papéis com a letra pequena do caderno preto; ainda não há confissão (a revelação é o Cap. 5).
 - PARTE 1 (Auren): manhã seguinte na BASE (a Lume sonhou com as luzinhas da Mãe-Fuligem: "elas tinham nome"). Pregoeiro:
   "O Acendedor-Mor compra a CASA DE SAÚDE DO LARGO: nunca mais um hospital no escuro." O Tico, no LARGO DO HOSPITAL
   (novo, saída leste da Avenida do Festival): o Dito "esqueceu de novo" e foi levado para a ALA DO DESCANSO.
   DE DIA (HOSPITAL, térreo): o porteiro Pavio não deixa entrar mala nem bicho: só de ROSTO (forma humana; o fôlego
   corre, se derreter lá dentro te põem para fora). IRMÃ DALVA, enfermeira-chefe cansada e boa (ainda lembra de tudo,
   trabalhou no Inverno Escuro), não pode deixar visitar o Descanso, mas dá a dica: "a lavanderia fica aberta de noite".
   Pacientes "melhoram" esquecendo a dor... e o resto (falas tristes e engraçadas: o velho que não lembra do reumatismo
   nem da esposa; a moça que esqueceu o medo de altura e o próprio nome).
   DE NOITE (ALA DO DESCANSO, 2º andar): MECÂNICA NOVA — A RONDA DAS LANTERNAS: enfermeiros-Pavios andam com lanterna
   acesa e um CONE DE LUZ fixo. Forma humana na luz = "visita fora de hora!" (volta para a lavanderia). Baú na luz só
   passa se estiver PARADO ("um baú de roupa suja"). A Lume de lustre brilha: vai coberta (pano). Inimigos da ala: PESADELO
   (o que sobra quando tiram a lembrança: sombra que dá MEDO = vez atrasada; fraco a luz) e LENÇOL (lençol de cama que
   ENROLA e prende um aliado; fraco a fogo e corte). Camas com potes de âmbar em fios que sobem pelo teto (canos -> Farol).
   MINI-CHEFE: o RELÓGIO DE PLANTÃO (relógio de parede do corredor que "marca a hora do descanso"): a cada 3 vezes o
   ponteiro gira e muda a HORA: manhã (fraco a gelo), tarde (fraco a fogo), noite (fraco a luz); golpe preparado
   "HORA DO DESCANSO" (adormece um aliado) cancelável pela quebra.
   SALA DO DIRETOR: ficha do Dito "TRANSFERIDO: CANDEIA (ar de serra)", e a LISTA DO DESCANSO: nomes com a letra pequena e
   cuidadosa (o jogador reconhece a letra do caderno), e no rodapé "pensão paga". A Irmã Dalva chega, vê, e conta que
   CANDEIA (a vila mineira na serra, onde nasceu o âmbar da capital) APAGOU há dois dias. Fim da Parte 1.
 - PARTE 1 IMPLEMENTADA (cap4.js + arte_cap4.js + inimigos4.js + maps/cap4maps.py -> mapas4.js; mapas largo, hosp1,
   hosp2, sala). G.poder 3 no início do capítulo. Entrada: saída leste da Avenida do Festival (depois de c3Fim). Mapas
   "soBau" (Ala, Sala): a Lume e a Rita vão dentro do baú (sem seguidores). Ronda: ents t:'ronda' (path de 2 pontos,
   pausa nas pontas, dá a volta se o baú bloquear), cone de 4 tiles com linha de visão (coneRonda), escuro próprio
   (HOOK_AR, noiteHosp). Maçanetas: a porta da Sala exige o rosto. De dia, se o rosto derreter no térreo, te põem para
   fora. Números: Pesadelo 280 PV/ATQ 28, Lençol 300/26, Relógio de Plantão 3800 PV/ATQ 32 (hora muda a cada 3 vezes,
   Hora do Descanso preparada a cada 4). Robô 0.6: comuns custam ~10-40%; Relógio termina com ~40-90% (mínimo ~16-32%).
   Flags: c4Init, c4Largo, c4Tico, c4Hosp, c4Noite, c4Ronda, c4CamaDito, c4Relogio, c4Sala, c4Ficha, c4Lista, c4P1Fim.
 - PARTE 2 (Candeia, a vila apagada): o 31 sobe a serra; névoa; moradores parados nas portas sem lembrar o que iam
   fazer; minas de âmbar vazias; RUNA DE GATILHO (4º espaço do Grimório, armadilha na linha do tempo); a Irmã Dalva vai
   morar na base (ENFERMARIA: cura entre lutas com custo de cobres); o Seu Jorge abre a GARAGEM (o 31 viaja entre
   regiões); chefe nas minas; o Dito encontrado; gancho: a página arrancada com LÍVIA (revelação no Cap. 5; ver o
   MAPA DA TEMPORADA no topo: agora são 10 capítulos, e o Farol acende só no Cap. 10).
   IMPLEMENTADA (cap4b.js, mapas4b.js via maps/cap4bmaps.py, arte_cap4b.js, inimigos4b.js, gatilho.js): o Jorge no Largo
   ("Subir a serra") -> ESTRADA DA SERRA (névoa no HOOK_AR: m.nevoa) -> CANDEIA -> casa da DONA ILDA (professora de runas
   que escreve tudo para não esquecer; ensina a RUNA DE GATILHO e dá a chave da porteira) -> MINA (escura, lampiões) ->
   CAPELA: CAPATAZ DE CANDEIA (5600 PV/ATQ 36, escudo 6; robô 0.6: mínimo ~23-46%; Apito do Turno preparado quando turns%4===3: bate em todos e
   um aliado ESQUECE a vez; chama 1 Mineiro Oco; Lanterna Morta come Tensão; fase 2 a 50%: fornalha aberta, fraco a
   gelo/corte/luz). Comuns: Névoa 300/28 (voa; golpe físico atravessa 35%; come Tensão; pode fazer ESQUECER a vez),
   Mineiro Oco 390/31 (Desabamento a cada 3 vezes). Fim: os transferidos acordam, o Dito lembra do Tico, a página
   arrancada no livro de ponto ("312 almas... 40 invernos de luz... pensões pagas" + o nome LÍVIA riscado e reescrito;
   SEGREDO: não explicar fora do jogo), Candeia acende um pouco, a base ganha ENFERMARIA (Dalva: cura completa grátis,
   frasco com selo por 20) e GARAGEM (Jorge: viagem rápida entre regiões). Flags: c4Serra, c4Candeia, c4Zezinha, c4Poco,
   c4IldaVista, c4Gatilho, c4Chave, c4Mina, c4Capataz, c4Fim (+ b_serra_m). Runa de Gatilho: G.grim.gatilho; página
   com s.g; armar é leve e +2 PM; dardo/onda disparam quando o inimigo vai agir (30% mais forte, +1 quebra, +2 se ele
   estiver preparando golpe); véu dispara quando o aliado cai abaixo de 35%.
 - DIA E NOITE SÃO ÚTEIS (regra do usuário: "coisas que só podem ser feitas em determinado horário"). Todo capítulo novo
   precisa de conteúdo amarrado ao relógio. No Cap. 4: Dona Ilda só recebe de DIA (7h-18h; bilhete na porta à noite);
   a capela da mina só abre no TURNO DA NOITE (de dia empurra de volta); de noite os moradores de Candeia andam
   sonâmbulos até o poço e cochicham pistas (de dia só ficam parados); o poço só mostra o tesouro à NOITE; o baú
   escondido do mirante da serra só aparece AO AMANHECER (5h-8h30, a névoa abre); a Pensão dos Transferidos muda de dia
   para noite. O hospital (P1) já era: de dia com rosto, de noite pela lavanderia. O Marco descansa até 7h ou 19h30.
 - MAPA E MISSÕES (mapa.js; pedido do usuário: "um mapa, e nele devem ficar marcados os locais das missões"): menu >
   "Mapa e missões". Aba AQUI: o mapa atual pintado tile a tile (textura por tipo de chão, paredes com face 3/4 e
   sombra, água com brilho correndo, escuridão com furos de luz nos mapas escuros, saídas pulsando em âmbar, Marcos,
   baús ainda fechados, o jogador como um baúzinho); se o mapa não cabe, a vista acompanha o jogador. Aba MUNDO:
   relevo pintado por altura (luz do noroeste, curvas de nível, neve nos picos), rio que corre, mar, margens de areia,
   pinheiros com sombra, estradas curvas, sombras de nuvens passando, NÉVOA sobre o que ainda não foi descoberto, noite
   com luzes acesas, rosa dos ventos e moldura de pergaminho. Missão principal = "!" dourado; opcionais = "?" azul; com
   selo de horário (DE DIA / À NOITE / AO AMANHECER, apagado quando não é a hora). Se a missão é em outro mapa, o
   marcador vai na SAÍDA que leva até lá (busca por portas + LIGA_EXTRA). Missões vêm de missoes() pelas flags: ao
   criar um capítulo novo, ACRESCENTAR as etapas lá (e as regiões novas em REGIOES/REGIAO_DE/ESTRADAS). G.visto guarda
   os mapas visitados. O menu de campo foi refeito (caixa 144 px, valores à direita, descrição de cada opção embaixo). list() (core.js) agora
   nunca vaza texto: alarga a caixa se uma opção não cabe e a caixa de descrição cresce com o número de linhas.
   NA HISTÓRIA o mapa é a MAGIA ESPACIAL do baú se manifestando (ele sente o espaço dobrado dentro da tampa e "vê" o
   mundo pelo avesso). Diálogo na primeira vez que abre (primeiroMapa, flag mapaVisto): o Catálogo registra que mapear
   assim é coisa de meia dúzia de nomes na história; a Rita pede segredo (a Coroa não pode saber).
 - CANTAR PARA O SINO (Cap. 2): na fase 3 da Âncora-Mãe, enquanto a Lume não cantou, o anel dela ganha um comando
   PRÓPRIO, o primeiro e já selecionado: "Cantar p/ o sino" (ícone de nota). Fica lá até ela cantar (antes era uma
   pergunta que só aparecia uma vez, e o usuário se perdeu). Efeito: o sino bate 25% mais fraco até o fim e a canção
   cura 25% do grupo; uma dica avisa onde fica o comando. Quem passou sem cantar: missão opcional "A canção do sino"
   (só À NOITE, Irmã Celeste na praça; flag cantoTardio; frasco + pluma + 60c). A caixa de descrição da batalha agora
   cresce com o texto e o "Vez de" nunca fica embaixo do anel.
 - DIÁRIO DE MISSÕES (diario.js; menu > Missões): abas EM ANDAMENTO / CONCLUÍDAS; cada missão com tipo, quem pede,
   descrição, última etapa feita (visto) e a atual (seta) — as futuras ficam ESCONDIDAS para não estragar a história —,
   onde (pela busca do mapa), selo de horário, recompensa e barra de andamento. Catálogo DIARIO (principais por capítulo +
   paralelas) + pedidos aceitos do quadro. AO CRIAR CAPÍTULO NOVO: acrescentar a principal e as paralelas em DIARIO e os
   alvos em missoes() (mapa.js). As paralelas antigas do Cap. 2 (Tobias, Pedrinho, Pavio) agora também aparecem no mapa.
 - CIDADES ORGÂNICAS (pedido do usuário: mapas "muito retilíneos... claustrofobia... parece um beco"; aprovado o piloto
   da Praça do Sino: "perfeito, pode dar o tratamento em diferentes estilos, mas com o mesmo cuidado"). Cada cidade num estilo:
   PRAÇA DO SINO (46x34) orgânica: fachadas em profundidades e alturas diferentes (sobrados com wallH maior onde a casa
   avança), quintais com árvore entre as casas, largo aberto com a torre e a fonte, igreja num patamar com escadaria até
   o rio em curva. CAIS (48x30) porto de trabalho: armazéns, deque de madeira, três píeres de comprimentos diferentes,
   barraquinhas, caixotes, o 31 estacionado. BAIRRO BAIXO (44x30) operário: sobrados estreitos, um QUARTEIRÃO SOLTO no
   meio, pracinha da feira, varais, canal com mureta em curva, viela do bueiro. AVENIDA DO FESTIVAL (52x28) bulevar
   PLANEJADO: palacetes simétricos, praça recuada com o palco no eixo, alamedas de árvores e postes, varais de lanternas
   (FE.varais), jardim com canteiros. LARGO DO HOSPITAL (46x30) praça NOBRE: hospital no eixo, jardim formal em cruz com
   a fonte no centro, bancos, lavanderia afastada. CANDEIA (40x34) MONTANHA EM SOCALCOS: três patamares com muros de
   arrimo e escadas de pedra; casas encostadas no muro (wallH 74). REGRAS: posições sempre em POS (nada fixo no código);
   ligações por gatilho em ligaExtra() (mapa.js); árvores com solid 1x1 levam arvore:true (o tempo2 tratava como poste);
   loadMap2 tira o jogador de dentro de parede se um save antigo cair em lugar que virou sólido. Arte nova em
   arte_cidades.js (varalArt, canteiroArt, lirioArt, chamineArt, relogioAfundadoArt).
   RUA SUBMERSA (40x30) e MERCADO AFUNDADO (34x26) refeitos também: ilhas de telhado em formas ORGÂNICAS (blob com ruído,
   não retângulos), restos de muro saindo da água, correntezas sinuosas, postes afundados, chaminés, vitórias-régias; no
   Mercado, o relógio da feira afundado até o mostrador no meio da praça. Saída do Poço volta em POS2.rua2.pocoOut.
 - PLACAS (placas.js): tabuletas penduradas com ícone nos prédios onde se entra (TABULETAS) e plaquinha com o NOME do
   destino ao chegar perto (3 tiles) de qualquer entrada/saída em todos os mapas (portas + ligaExtra; ROTULOS acrescenta
   e renomeia). O texto usa sz: TXZ para ficar nítido no quadro grande do mundo.
 - VIDA NA CIDADE (vida.js; pedido do usuário: gatos nos telhados, pássaros que voam quando se passa perto, coisas
   mágicas): pombos (corvos em Candeia) que ciscam e voam em bando quando o grupo chega perto e voltam depois; gatos andando,
   sentando e se lambendo nas lajes e muretas (olhos brilham de noite); borboletas de dia; vaga-lumes de âmbar de noite ou
   no escuro; CARTAS VOADORAS (correio mágico: envelope dobrado em passarinho com rastro de faísca); peixes pulando; bandos
   e gaivotas no céu. Configuração por mapa em VIDA_CFG (acrescentar os mapas novos). Só enfeite: não bloqueia nem salva.
 - LUME CANTA NA FONTE (economia2.js, só À NOITE, 1x por noite): agora a fonte inteira (8 tiles) é interativa; de dia
   a Lume avisa que canta depois das sete; aparece no mapa como opcional "A Lume canta na fonte" (À NOITE).
 - PORTA TRANCADA (world2.js portaTrancada): toda casa do mapa agora tem porta desenhada; as que não levam a lugar
   nenhum avisam "trancada" (com variações de humor) quando o jogador anda contra ela ou aperta A de frente. Para abrir
   uma construção nova no futuro, basta pôr uma 'porta' (ent) na frente dela.
 - BALÕES DE FALA NO MAPA (world2.js): fila BAL desenhada no fim do quadro (depois da noite/telhados), 14 px de altura
   para a fonte, rabinho para quem fala, presos na tela, desviam do painel, relógio, botões e aviso; reação (pri 1) sobe e
   empilha, balão de fundo que bate é descartado; um por pessoa; texto fixo por ciclo (nada de sortear a cada quadro);
   somem quando há janela aberta.
 - CONTROLE DE TOQUE: ANALÓGICO (pino que segue o dedo, zona morta no centro; empurrar pouco = andar devagar).
 - ANDAR NO MAPA: 8 direções (diagonais com duas teclas ou no direcional de toque; não corta quina de parede, desliza
   pelo eixo livre). Menus e batalha continuam em 4 direções.

 CAPÍTULO 5 — O CADERNO PRETO (implementado; mapas5.js, arte_cap5.js, puzzle5.js, grimorio5.js, inimigos5.js, cap5.js,
 cap5b.js, cap5_integra.js; mapas em maps/cap5maps.py com validação e simulação do feixe)
 - LUGAR NA ESCALADA DO VILÃO: passo 3, a CONFISSÃO no chá (o que ele diz está em cap5.js, vesperCha; nada disso vai
   para o chat). O grupo sai do capítulo PROCURADO pela Coroa (cartazes em Auren, Largo, Festival, Praça e Cais).
 - FLUXO: base (Lume compara a página com a lista) > Dona Iolanda reconhece o papel-lírio e ensina a RESSONÂNCIA >
   BONDINHO no Largo (x45, só de dia) > CIDADE ALTA (56x40, jardins de sebe, estufa, fonte, torre de vidro) > o jardineiro
   Benedito perdeu a TESOURA no LABIRINTO > chave da ESTUFA > três PLACAS de pressão com vasos (levados no VÃO) abrem o
   ALÇAPÃO (só de noite) > SALA DAS LENTES (feixe de luz com espelhos que giram e mudam de lugar; o cristal vermelho
   dá alarme) > ARQUIVO DAS VELAS (acender na ordem: Osvaldo Candeia, Joaquim, Dito; o Dito fica no alto e pede a
   ESCADINHA; errar apaga tudo e chama 3 mariposas) > mini-chefe VITRAL VIVO > ESCRITÓRIO (o caderno) > o chá >
   TELHADOS (fuga furtiva: holofotes e guardas pegam GENTE sempre e o BAÚ só andando; vãos pedem TÁBUA do Vão; pontos
   de retorno CP_TELHADO) > chefe GRANDE HOLOFOTE > descida pela torre do sino > base > FIM.
 - MECÂNICAS NOVAS: (1) VÃO DE BOLSO: o baú guarda UM objeto móvel (vaso, espelho, caixote, escadinha, tábua) e põe na
   frente (A diante do objeto: Girar/Guardar; A no vazio: pôr). Tábua sobre abismo vira PONTE. (2) FEIXE (tracaFeixe):
   alvo/alarme checados ANTES da parede (os cristais são sólidos). (3) FURTIVIDADE: cones de holofote e rondas
   (stealth) > pegoNaLuz > luta (grupoLuz) e volta ao ponto de reinício. (4) ELEMENTO AREIA (corte, quebra 1) com
   fusões: Vidro (brasa), Granizo (geada), Espinheiro (seiva), Tempestade de Areia (fuligem). (5) RESSONÂNCIA: véu em
   Rita/Lume faz o próximo golpe dela levar o elemento a +30%. (6) VELA INTERIOR (c5Vela): técnica da Lume e +10% MAG;
   ela não "esquece" mais a vez.
 - DIA/NOITE: bondinho e jardineiro de dia; alçapão, mirante e Dona Hortênsia de noite; vigias da Cidade Alta só de
   noite; o sorvete derrete em ~90 min de jogo (comprar perto das 19h, entregar logo que escurece).
 - INIMIGOS: Vigia de Vidro 430/33 (espelha magia), Mariposa de Vidro 300/31 (rouba PM), Guarda Real 470/34 (chama
   reforço). Lutas fixas: mariposas na estufa, vigia+mariposa no arquivo (20,12), guarda+mariposa nos telhados (37,23).
   VITRAL VIVO 4300/35 (cor muda fraqueza e reflexo; Prisma preparado). GRANDE HOLOFOTE 6500/38 (Varredura, Cegar,
   Facho Total; fase 2 chama guardas). Robô no Desafio (farol e escriba, 0,6): comuns 10-60% de custo; Vitral deixa
   ~20-50%; Holofote ~10-35% (bebendo os frascos).
 - OPCIONAIS: Sorvete de lavanda (Dona Hortênsia, Monóculo do Conde), A pipa do Quinzinho (canto sem saída do
   labirinto), O mirante (de noite). Diário, missões no mapa, placas e VIDA_CFG da Cidade Alta e dos Telhados prontos.
 - TELHADOS COM CORPO (cap5b.js telhadoOverlay): fachadas que descem para o escuro com janelas acesas, cumeeiras,
   beirais e a cidade lá embaixo (casinhas e lampiões).
 - FLAGS: c5Init, c5Iolanda, resson, c5Alta, c5Tesoura, c5Chave, c5Areia, c5Alcapao, c5Lentes, c5Porta1, c5Velas,
   c5Vitral, c5Caderno, c5Cha, c5Vela, c5Telhados, c5cp, c5Holofote, c5Fim; opcionais c5Dama, c5Pipa, c5Mirante.
 - GANCHO DO CAP. 6: o grupo procurado em Auren; os nomes anotados com data ("a gente devolve, um por um").

 CAPÍTULO 6 — A CIDADE DOS PAVIOS (implementado; mapas6.js, arte_cap6.js, disfarce6.js, fabrica6.js, inimigos6.js,
 lembranca6.js, cap6.js, cap6b.js, cap6_integra.js; mapas em maps/cap6maps.py, com validação e SIMULAÇÃO DAS ESTEIRAS:
 sem as alavancas não se chega à saída; com elas chega; e de qualquer estado sempre dá para chegar à saída e voltar)
 - LUGAR NA ESCALADA: depois da revelação, o grupo é PROCURADO. Vesper não aparece em pessoa: manda um BILHETE no fim
   (a conta das "onze noites de hospital" que as lembranças soltas custaram). Ele não se zanga; ele anota. (Segredo: só
   no jogo e aqui.) O âmbar "de farmácia" da Coroa é feito das lembranças dos Pavios (o gancho "gosto de saudade").
 - FLUXO: base (Dalva traz os cartazes e os lençóis: LAVADEIRAS) > Largo: portão novo embaixo à direita (38-39, 28-29)
   para a VILA DOS PAVIOS (cancela: "roupa de onde?" -> Ala Sete) > OSVALDO CANDEIA (de Velhágua; o baú PROVA o frasco de
   farmácia do grupo: a lembrança de um menino de farda) > casacos de Pavio no VARAL (de dia, de lavadeira) > de NOITE,
   de PAVIO, a DONA COTINHA recebe a lembrança: o filho é o SARGENTO BRÁS, que muda de lado (Passe da Guilda; a Caçadora
   do Festival some) e conta que a CHAVE DO COFRE está com o Herói nº 30 > SEU LÚCIO (o bardo de Velhágua) monta uma
   TRUPE (teste de ritmo, ritmoLume) > o SHOW de NOITE no palco do Festival: o TIAGO avalia o baú e luta (mini-chefe; na
   metade ele escolhe; a herança da T1 muda a fala: esc.tiago) e entrega a chave > CASA DO SELO (cancela: crachá 47;
   só PAVIO): GALPÃO DAS ESTEIRAS (faixa amarela, Selos Vivos de ronda, piso das esteiras com 3 alavancas, corredor das
   3 PRENSAS) > COFRE DAS LEMBRANÇAS (estantes: achar pela descrição as lembranças do Osvaldo, do cozinheiro que
   assobia e da lavadeira do dedal; frasco errado vira Frasco Rachado) > a terceira acorda a SELADORA REAL (chefe) >
   as lembranças voam pelas chaminés de volta para a vila > a CALHA de descarte cai no canal > o Osvaldo lembra da
   CANDINHA e conserta o RELÓGIO DA VILA (parado nas 3h17) > o bilhete > base: o Seu Jorge reconhece a estrada da
   etiqueta "MINA DE ORIGEM · pelo cano do CORAÇÃO" (gancho do Cap. 7) > FIM. A Guarda sai do Bairro Baixo "para as minas".
 - MECÂNICAS NOVAS: (1) DISFARCE EM GRUPO (MENU > Disfarce; figurino() recolore Rita e Lume e enfeiteBau() veste o
   baú): LAVADEIRA (de dia; Bairro Baixo, Largo, Festival, Vila), PAVIO (de noite; Auren toda, Vila, e dentro do Selo a
   qualquer hora), TRUPE (qualquer hora, só Festival e Largo). Sem disfarce, guarda que vê = alarme (o baú parado não
   salva: o cartaz tem as moças). Figurino fora de hora/lugar é pior. CANCELAS (montaBarreira): guarda + pergunta de
   ofício por figurino (respostas aprendidas: Ala Sete; o relógio parado 3h17; crachá 47). Lutar disfarçado: +20 Tensão.
   MARCOS VIGIADOS em Auren: só se toca de PAVIO (um Pavio de guarda ao lado). (2) ESTEIRAS (fabrica6.js): pisou, vai
   até o fim; alavancas viram o sentido. PRENSAS com ritmos diferentes. FAIXA: no Selo, fora da faixa = alarme mesmo de
   Pavio. (3) DEVOLVER LEMBRANÇAS (lembranca6.js; MENU > Lembranças): 5 frascos (Cotinha, Osvaldo, Afonso, Zélia,
   Juvenal); abrir perto do dono: o Pavio volta a ser gente (sprite e nome mudam) e dá recompensa. As 5 ensinam ao baú a
   DEVOLUÇÃO (35T: devolve ao inimigo, mais forte, o último golpe que o grupo levou). (4) SELADO (status): sem técnicas,
   runas, dupla e super na próxima vez (o robô ataca). (5) BILHETE (status): o próximo golpe dói 40% mais.
 - INIMIGOS: Selo Vivo 520/36 (carimba = SELADO), Frasco Rachado 360/34 (esquecer a vez; quebrado cura o grupo 6%),
   Caçadora de Recompensa 560/37 (rede atrasa; lê o cartaz e fica mais forte). TIAGO 4900/38 (Avaliação = BILHETE no mais
   frágil, TROCO devolve golpe físico, Catraca, Passagem Só de Ida preparada; fase 2 sem troco e mordida pega).
   SELADORA REAL 7600/41 (Carimbo, Esteira atrasa a vez, PRENSA REAL preparada; 55%: o tanque racha e solta Frascos;
   25%: SELO REAL em todos e o fogo passa a pegar; 7200 PV depois do robô). Robô (Desafio, farol e escriba, 0,6): comuns
   custam 10-65%; Tiago deixa o mais frágil em ~20-50%; Seladora vence com mínimos de ~1-40% (o Escriba no limite, como pede o
   perfil mágico). Lutas de cancela e de Marco vigiado usam guardas (semSurpresa).
 - DIA/NOITE: lavadeira, varal, Zélia, Seu Lúcio e o teste de dia; Pavio, Cotinha, o show e o Selo de noite.
 - OPCIONAIS: o pão sem assobio (Afonso: Avental de Padeiro), o dedal (Zélia: Dedal de Prata), a casa sem número
   (Juvenal: frasco achado na ilha I5 das esteiras), Cinco lembranças (Devolução); baús no galpão e no cofre.
 - FLAGS: c6Init, c6Vila, c6Osvaldo, c6Casaco, c6Bras, c6Trupe, c6Tiago, c6Chave, c6Selo1, c6Selo2, c6Pegou[],
   c6SeladoraAcordou, c6Seladora, c6Etiqueta, c6RelogioVolta, c6Fim, c6Devolucao; G.disfarces/G.disfarce, G.lemb, c6belts.
 - GANCHO DO CAP. 7: a Mina de Origem e o cano do Coração; o Seu Jorge conhece a estrada (e lembra pouco do caminho).

 CAPÍTULO 7 — A MINA DE ORIGEM (implementado; mapas7.js, arte_cap7.js, evolucao7.js, mecanicas7.js, inimigos7.js, cap7.js,
 cap7b.js, cap7_integra.js; mapas em maps/cap7maps.py com validação e SIMULAÇÃO das válvulas e das pontes de eco)
 - ESCALADA 4 (segredo; só jogo e bíblia): o grupo vence o Extrator, mas o Vesper desce com a Guarda e cobra a "carga" para
   religar a máquina (quer ler a Lume). O SEU JORGE desce pelo guincho do 31 e TROCA as lembranças dele (50 anos de
   estrada, dois mundos) pela vida do grupo. O Vesper aceita, sinceramente ("eu cumpro o que eu anoto"). O Jorge vira
   Pavio ("Boa noite. Eu acendo os postes da Coroa."), sobe com a Guarda. G.flags.c7Jorge: o Jorge some de todos os mapas;
   a garagem fica sem motorista (o 31 só anda com os Marcos; Cap. 10 devolve só um pedaço, conforme o plano). Ninguém
   prende o grupo. Gancho do Cap. 8: naquela noite um bairro de Auren APAGA de propósito ("Ele tá cobrando." — Dalva).
 - FLUXO: base (o Jorge nervoso; a garagem tem o destino novo) > ESTRADA VELHA (minijogo estradaMinas: 3 faixas;
   pedras, buracos, cabras, frascos caídos; DE DIA cancelas da Guarda (bater = luta), DE NOITE só o farol) > ACAMPAMENTO
   (Guarda de Auren, Pavios mineiros, Dona Bina, o cão Sabugo, Tonho de Candeia; o 31 escondido; o Jorge oferece voltar
   à base) > cancela da BOCA DA MINA (só PAVIO; "galeria?" -> "das bombas", na PLACA DOS TURNOS) > GALERIAS DE
   BOMBEAMENTO (5 galerias, 4 respiros A-D, 4 válvulas que viram 2 respiros cada; solução V1, V2, V4) > A BROCA
   (mini-chefe) -> elemento ÂMBAR > O CORAÇÃO (poço escuro, PEDRAS DE ECO: a Lume canta, as pontes acendem ~7s; cair
   volta à pedra) > elevador > ANDAR 1 DO JOGO 1, visto de cima e drenado (Câmara do Despertar: o pedestal do baú;
   o gancho do lustre da Lume; Sala de Leitura Afogada: a página da Ofélia; música "despertar" do jogo 1) > GUARDA-
   MUSGO AMBARINO (mini-chefe 2; drenado por um cano: perde vida sozinho na fase 2; vira semente) > o buraco da broca >
   O FUNDO: O EXTRATOR (chefe) > a cena > 2ª EVOLUÇÃO > a subida (a Rita dá "duas bombadas no pedal") > FIM.
 - 2ª EVOLUÇÃO (evolucao7.js): cada caminho do Cap. 3 abre em dois, escolhidos como resposta à perda:
   Farol: GUARDIÃO (Muralha de Luz: provoca 2 e Farol no grupo; grupo leva -10%) / TEMPESTADE (Raio em Cadeia; raios do
   Farol em dobro). Vão: LABIRINTO (todos perdem a vez e ficam tontos; Guardar Dentro custa 15) / BOCA (Engolir comum
   <25% inteiro e cura 25%; físico x1,35). Escriba: BIBLIOTECÁRIO (2 feitiços de graça +25%; +1 página) / PALIMPSESTO
   (Reescrever: fraco a todos os elementos por 3 + marca; magia x1,25). Preços: voz da mãe; chuva no telhado; o quarto;
   o gosto de tudo; o primeiro livro e quem leu; o nome da Terra. Adereço novo por cima do da 1ª (aderecoEvo7).
 - ÂMBAR (mecanicas7.js): luz-pedra, quebra +1, RESINA (alvo perde 20 de vez); fusões Lava Dourada (brasa), Cristal
   (geada), Resina (seiva), Fóssil (fuligem), Vitral (areia); véu "Bolha de Âmbar" (próximo golpe some).
 - INIMIGOS: Cão-Lanterna 560/40 (uiva e chama outro), Válvula Viva 620/38 (Estouro preparado), Rato-de-Vela Ambarino
   480/38, Cogumelo de Âmbar 600/37 (tonto), Morcego Carimbado 420/39 (SELADO). A BROCA 5200/41, GUARDA-MUSGO AMBARINO
   6000/42, O EXTRATOR 8400/44 (Sucção/Leitura: PM, Tensão e esquecer; Bombeamento; núcleo aberto a 30%).
 - VOLTAS COM A VIAGEM RÁPIDA (pedido do usuário: resolver coisas novas em lugares antigos): lanterna do Zé (Tonho ->
   Dona Ilda, Candeia: Lanterna do Zé), Sabugo (pão de milho do Afonso, Vila dos Pavios, só com a lembrança dele
   devolvida: Coleira do Sabugo), semente do Musgo (Seu Benedito, Cidade Alta, de dia; brota NO DIA SEGUINTE: Flor do
   Musgo), página da Ofélia (Dona Iolanda, Auren: +1 página no Grimório; fala muda se a Ofélia lembra, herança T1).
   REGRA DAQUI EM DIANTE: todo capítulo tem pelo menos 2 opcionais que pedem voltar a mapas antigos.
 - FLAGS: c7Init, c7Chegou, c7Bombas, c7vent{A-D}, c7Broca, c7Coracao, c7Andar1, c7Pedestal, c7Gancho, c7Pagina(Feita),
   c7Musgo, c7Semente, c7Plantou(dia), c7Flor, c7Fundo, c7Extrator, c7Jorge, c7Fim; c7Carta(Feita), c7SabugoPista, c7Pao,
   c7Sabugo; G.evo7.
 - ROBÔ (Desafio, 0,6, farol e escriba, depois do ajuste): comuns 10-80% (a dupla de cães com guarda é a mais dura);
   Broca ~20-45%; Guarda-Musgo ~15-65%; Extrator ~0-40% (o Escriba no limite, sem frascos sobrando).

 CAPÍTULO 8 — O INVERNO ESCURO (implementado; mapas8.js, arte_cap8.js, inverno8.js, inimigos8.js, evolucaoLume.js, cap8.js,
 cap8b.js, cap8_integra.js; mapas em maps/cap8maps.py, salões de gelo verificados por scratchpad/ice/gen2.py)
 - ESCALADA (segredo; só jogo e bíblia): o Vesper "cobra" a troca do Jorge apagando Auren bairro por bairro, 7 noites de
   inverno. A cidade se acende à mão (braseiros, velas, a Lume). No fim, vendo a cidade acesa sem ele, o Vesper escreve no
   caderno: "Eles não precisam do Farol." ...Então está na hora de acendê-lo. Gancho do Cap. 9 (o Morro). A fita
   cor-de-rosa da gaiola da Friagem é a 3ª coisa dele na parede da base (página riscada, bilhete, fita: LÍVIA).
 - PARTE 1 (Auren de noite): ESCURIDÃO POR BAIRRO (auren, largo, festival, ruaPavios; dark 0,8 -> 0,5 quando aceso),
   CHAMA DA LUME (G.chama, 100; +20 de máx. com as velas de Velhágua; barra no HUD; a luz em volta do grupo cresce com
   ela), BRASEIROS (só de noite; custam 25 de chama, 15 com o lampião da Ilda, ou 1 vela G.velas), FRIAGENS no escuro
   (somem de dia ou com o bairro aceso), ESCOLTAS (medo sobe no escuro +0,24, desce na luz; em 100 a pessoa foge; chegou =
   +15 de chama): Nair e Bento -> bueiro (base); Nonato, Cida e Pipo -> hospital; Zefa, Lino e Osvaldo -> Festival.
   Na Vila, os Pavios devolvidos acendem braseiros sozinhos. Pontos de calor: lareira do abrigo (hospital), a Dalva.
   Cameo do Jorge-Pavio na Vila (c8Jorge). NOITE DA MÚSICA no palco: ritmo da Lume, VERSO NOVO (técnica), luta contra o
   CAPITÃO DA GUARDA APAGADORA (mini-chefe) e a fonte do Largo racha (c8P1).
 - PARTE 2 (AS CISTERNAS): salão dos canais (braseiros), Seu Tomé procura a NINA; SALÃO DE GELO 1 (escorrega até bater;
   braseiro aceso derrete o gelo em volta e vira chão molhado); câmara da Nina; ESCOLTA pelo corredor escuro (alavanca da
   grade); o pai abre a COMPORTA; SALÃO DE GELO 2; descida; O CORAÇÃO FRIO: A FRIAGEM (chefe). Cena: a fita na gaiola, a
   Lume cai sem chama, o Largo cheio de gente com velas, EVOLUÇÃO DA LUME, amanhecer, o caderno na torre, base, cartão.
 - EVOLUÇÃO DA LUME (evolucaoLume.js, pedido do usuário): a única evolução que NÃO cobra preço (foi dada). LAREIRA (apoio:
   +24 PV, +4 RES, +2 MAG; Lareira Viva cura 25%, limpa e AQUECIDO 3; passiva cura 3% do grupo na vez dela) / ALVORADA
   (ofensiva: +6 MAG, +8 PV; Raio da Alvorada x1,35 nas criaturas do escuro e do frio; luz +20%). Visual: lustre novo de
   noite (lustreEvoArt), adereço de dia (aderecoLumeArt). G.evoLume. Próximas: na T3, uma 3ª para ela também.
 - INIMIGOS: Friagem 640/42, Apagador 660/42 (apaga bônus), Lobo de Fuligem 600/44, Geada Viva 520/41 (congela = esquece a
   vez). CAPITÃO 4800/45 (chama apagadores; GRANDE APAGÃO zera a Tensão; fase 2 bate 2 vezes). A FRIAGEM 8000/47 (fases em
   66% e 33%; a 3ª mira a Lume; fraca a fogo, luz e mordida). Arte de chefe caprichada: capitaoArt (poses atk/carga) e
   friagemBossArt 150x148 (capuz, rostos congelados no manto, gaiola de lanterna com a fita).
 - VOLTAS COM A VIAGEM RÁPIDA: velas da Igreja do Sino (Velhágua: +10 velas, chama máx. +20); lampião da Dona Ilda
   (Candeia: braseiro custa 15); velas de âmbar da Dama (Cidade Alta: +6 velas); a Iolanda vende velas de dia (4 cobres).
 - A MOÇA DA BARCA VOLTA (pedido do usuário: "como a Ciel do Rimuru, para o baú"): ela fugiu no fim da T1 e não tinha
   aparecido na T2. SEMENTE NO CAP. 8: o FIO DE ÂMBAR nas Cisternas (c8Fio): o Catálogo dá erro de leitura, uma voz de
   dentro do baú diz "...trinta e um?" (WHO eco8, '???', âmbar), e o Catálogo corrige "ninguém falou". No fim do capítulo
   (sempre) o Catálogo admite "uma linha no meu registro que eu não escrevi" e diz "não sei" pela primeira vez.
   ARCO PLANEJADO: Cap. 9: ela fala às vezes pelo Catálogo (âmbar, sem colchetes, não consegue dizer o nome); o AVALIAR
   passa a mostrar o PRÓXIMO GOLPE do inimigo (ela lê intenções); uma volta com viagem rápida atrás de rastros dela
   (Velhágua / a boca da masmorra fechada). Cap. 10: no Farol, ela e o Catálogo se FUNDEM e o baú dá um NOME a ela (o
   jogador escolhe; tema do nome da Ofélia/Clara): vira companheira com personalidade e passiva própria. SEGREDO (nunca no
   chat): ela é a metade de Ada que sente culpa (ver SEGREDO DA TRILOGIA na T1); na T3 ela encara a outra metade. Ela
   nunca diz o nome de Ada; sabe que "ela vai chamar de novo".
 - FLAGS: c8Init, c8B_<bairro>, c8VilaAjuda, c8Jorge, c8Verso, c8P1, c8Cist, c8Tome, c8NinaAchou, c8Grade, c8Nina,
   c8Comporta, c8Coracao, c8Friagem, c8Fio, c8Fim; c8VelasVelhagua, c8Lampiao, c8Hortensia; G.chama, G.velas, G.evoLume.
 - ROBÔ (Desafio, 0,6): comuns 10-85% (o par de lobos é o mais duro; o Lobo ficou 0,55 x2 depois do ajuste); Capitão
   (5600 -> 4800, golpes menores) deixa ~20-40%; Friagem (10200 -> 8000, fase 3 mira a Lume 40%) deixa ~5-30% no Farol e
   25-85% no Escriba, os dois na 1ª tentativa. Antes do ajuste o Escriba perdia 7-24 vezes no Capitão.

 CAPÍTULO 9 — A SUBIDA DO MORRO (implementado; mapas9.js, arte_cap9.js, mecanicas9.js, inimigos9.js, cap9.js, cap9b.js,
 moca9.js, cap9_integra.js; mapas em maps/cap9maps.py: vento simulado e feixe resolvido por busca)
 - ESCALADA (segredo; só jogo e bíblia): o Farol acende "quando estiver cheio": toda noite uma fila de Pavios sobe com
   potes (as lembranças). No fim do capítulo, o grupo entra na escada do Farol (paredes de vidro, milhares de potes) e o
   Farol ACENDE lá de cima; o Vesper, na sala da lanterna: "Ninguém mais vai morrer no escuro." (gancho do Cap. 10, a
   IRONIA de Lívia acontece lá).
 - PARTE 1, O QUADRO DO CERCO (base): ALIADOS pelos Marcos, cada um com um trunfo: DALVA (base; tenda no sopé: cura e
   frascos), IOLANDA (Papelaria, de dia; o avô polia as lentes; o Grimório se escreve sozinho com a letra da Ofélia: a
   dica dos três espelhos, e "tem alguém morando no seu Catálogo, seja gentil com ela"; OBRIGATÓRIA), TICO E DITO (Bairro
   Baixo, de dia; o sinal de três batidas na calha faz o Dito lembrar da Chaminé Velha: atalho na Encosta), BRÁS (Vila
   dos Pavios, de noite, com a mãe; a Guilda arma uma briga na cancela; pede para trazer de volta quem ainda for gente:
   c9PromessaBras), DONA BADALADA (Velhágua; a Lume canta (ritmo); o sino toca meia-noite pela 1ª vez em cem anos:
   metade das rondas da Encosta desce). Iolanda + 2 bastam; "Hoje à noite" no quadro.
 - PARTE 2, O MORRO: SOPÉ (tendas, cancela: briga da Guilda ou luta guardaR x2 + cão) -> ENCOSTA (6 patamares em
   zigue-zague; VENTANIA: rajada a cada ~5 s com aviso de ~1,4 s; o vento empurra para o SUL; abrigo = pedra/rocha logo
   ao NORTE, encostar numa MURETA, ou estar na escada; cair da beira = cair no patamar de baixo; rondas com cone (stealth,
   pego = luta e volta ao começo do patamar); holofotes nos 2 patamares de cima SÓ DE NOITE; a Chaminé Velha (1º -> 3º
   patamar) se o Tico veio; o ESPANTALHO DO CERCO no 3º patamar) -> CRISTA (o Jardim das Lentes: feixe da Lente do
   Luar, 3 espelhos móveis pelo Vão, alarme vermelho na beira leste; solução mínima de 3 espelhos, conferida por busca;
   o ATRIL mostra a página da Ofélia; a porta abre e a luz atrai a RAINHA DO FAROL) -> PÁTIO DO FAROL (o TIAGO de guarda
   na porta, "eu guardo o troco": luta junto contra O FAROLEIRO jogando o TROCO a cada 3 ações; na fase 3 a moça racha a
   lente e o troco vem a cada 2). Final: o velho faroleiro (cem anos esperando o substituto) pode parar; a escada; a moça
   lembra de "uma escada assim, para fugir de uma voz; no fim tinha uma barca; eu tinha uma metade"; o Farol acende.
 - INIMIGOS: Sentinela de Latão 700/45 (Lanterna nos Olhos: tonto), Gralha do Morro 560/44 (rajada em todos, rouba
   Tensão), Mariposa de Âmbar 430/42 (COME LUZ). MINI-CHEFES ANTIGOS COM CARA NOVA: ESPANTALHO DO CERCO 5800/46 (o do
   Cap. 1 remendado pela Guarda com os cartazes do Farol e um pote de Pavio na cabeça; PEDÁGIO DO MORRO preparado;
   Rajada atrasa a vez; fase 2 a lanterna velha acende: gelo/mordida, Bafo, Cobrança) e A RAINHA DO FAROL 4500/46 (a
   Mariposa-Rainha do Cap. 3: na fase 1 a LUZ A CURA; filhas; SOPRO DO FAROL; fase 2 incandescente: gelo/corte, Come a
   Luz). CHEFE: O FAROLEIRO 8600/48 (Varredura faz esquecer a vez; Manivela; Gancho queima; LEITURA TOTAL tira 30 de
   Tensão; fase 2 Sentinelas e Raios; fase 3 a lente racha: escudo quebra, luz e corte pegam). Arte de chefe caprichada
   (espantalhoCercoArt 124x150, rainhaFarolArt 140x120, faroleiroArt 156x156).
 - A MOÇA DA BARCA (arco pedido pelo usuário, "como a Ciel do Rimuru"): no Cap. 9 ela fala ÀS VEZES pelo Catálogo (WHO
   eco8, em âmbar, minúsculas, sem colchetes): lista os aliados, avisa do vento, agradece a Ofélia, racha a lente do
   Faroleiro ("eu também sei ler"), consola o velho faroleiro. O Catálogo: "ela corrige a minha ortografia". RASTROS DE
   ÂMBAR (opcional com viagem): fios mornos nas Cisternas (Cap. 8), no Poço do Sino (Velhágua: a barca sem remo, "a
   tampa da noite com furinhos", o sino que ela ouvia lá de baixo) e na Câmara do Despertar (ela viu o 31 acordar,
   presa no âmbar do teto; riu quando ele mordeu o Musgo, "eu não ria fazia trezentos anos"; o nome "está atrás de uma
   porta, lá em cima eu abro"). Com os 3: LEITURA (Avaliar deixa o alvo LIDO por 3 golpes: ela avisa e o anel de defesa

 >>> SEGREDO: POR QUE O BAÚ EVOLUI (pergunta do usuário; NUNCA explicar no chat: só pistas no jogo e a resposta na T3) <<<
 - Evoluir não é um dom do baú: é a DIGESTÃO da masmorra (o sistema que Ada montou, ver SEGREDO DA TRILOGIA na T1). Toda
   alma que cai vira monstro e "amadurece" em degraus; cada degrau aperta a alma e espreme uma lembrança (o PREÇO). O que
   é espremido vira âmbar. O fim natural da escada é a alma inteira virar âmbar (os monstros que "somem" no fundo).
 - Por que ele é diferente: é um MÍMICO, um RECIPIENTE. Pela regra da própria masmorra, o que está GUARDADO não é digerido.
   Ele sobe os degraus, mas o núcleo nunca vira âmbar, e as lembranças cobradas não somem: ficam guardadas no fundo do
   baú, onde a moça da barca morava. Ela "leu você todo dia": leu e guardou cada lembrança que ele pagou. Na T3 elas
   podem VOLTAR (escolha e custo).
 - Na superfície (T2) ele só evolui nos VEIOS DE ÂMBAR: âmbar é digestão acumulada de outras almas. Evoluir lá em cima é
   crescer comendo o que foi espremido de outros, exatamente o que a vilã faz para não envelhecer. Espelho moral da T3:
   continuar evoluindo é virar o que ela é?
 - A Lume evolui SEM PREÇO porque "foi dado": a moça, de dentro do baú, pagou com o que guardava. É o primeiro sinal dela.
 - REVELAÇÃO EM DEGRAUS: T2 = pistas (o preço em lembranças, os veios de âmbar, a evolução grátis da Lume, "eu li você todo
   dia"); começo da T3 = o OTÁVIO estranha que um monstro evolua fora da masmorra ("isso não devia ser possível");
   meio da T3 = a companheira mostra as lembranças guardadas; fim da T3 = a escolha (parar de evoluir, devolver as
   lembranças, ou usar a escada contra quem a construiu).
 - POR QUE O CATÁLOGO SE LIGOU A ELE (pergunta do usuário; mesma resposta, mesmo segredo):
   . Toda alma que cai recebe uma FICHA do Catálogo. A ficha é o cronograma da digestão: cada evolução é uma linha nova
     que o Catálogo escreve, e cada linha espreme uma lembrança. As fichas comuns são FECHADAS: o monstro nunca ouve o
     Catálogo, só muda. (Por isso nenhum outro monstro "tem sistema".)
   . A ficha do 31 NUNCA FECHOU: um recipiente não pode ser catalogado (regra da própria masmorra; a mesma da runa que
     "não pode ser copiada, refletida nem catalogada"). Sem conseguir fechar, o Catálogo teve que ATUALIZAR À MÃO, em voz
     alta, todo dia: os colchetes que o jogador lê desde o Cap. 1 da T1 são uma ficha aberta.
   . A ficha aberta é o MOTOR DA EVOLUÇÃO dele: ele evolui mais vezes, ESCOLHE o caminho (os outros têm caminho fixo) e
     não é digerido. O preço cai, mas a lembrança fica guardada (ver acima).
   . O laço virou pessoa: a boca do Catálogo era a metade de Clara que lembra; falar todo dia com uma ficha aberta a fez
     sentir. No fim da T1 ela escolheu ficar DENTRO dele (por isso o Catálogo mora no baú na T2).
   . QUEM FEZ DELE UM BAÚ (revelação da T3): a moça da barca, presa no âmbar do teto da Câmara do Despertar, empurrou o
     renascimento do 31 para um RECIPIENTE: a única alma que a máquina não consegue digerir. Foi o ato de culpa dela contra
     a outra metade. Pistas já no jogo: "eu vi o 31 acordar", "eu li você todo dia", a Lume evoluindo sem preço.
   . Revelar junto com o porquê da evolução: começo da T3 o Otávio pergunta "por que só ele ouve o sistema?"; meio da T3
     a companheira admite que escolheu o corpo dele; fim da T3 a ficha aberta é a arma (o que não fecha não se digere).

   Poeta, povo, feirantes), com reações do grupo; o Catálogo abre a página "Os Oito Pilares" no menu (o que não ouviu = ???).
   Boatos sobre o ACENDEDOR-MOR: "se quisesse, sentava numa cadeira"; "só espera a cadeira certa vagar"; "gente de Pilar".
   >>> SEGREDOS (nunca no chat) <<<
   . A LANTERNA É ADA (a vilã da trilogia). O mundo a conhece como Pilar do topo: por isso "ninguém nunca precisou vê-la
     lutar". A fala do retrato que não muda é pista da imortalidade de âmbar.
   . O VESPER (Acendedor-Mor) está NO NÍVEL dos Pilares e QUER A OITAVA CADEIRA: é a promessa que Ada fez a ele (motivo
     dele na T2). Ele nunca a recebe.
   . O ÚLTIMO OITAVO (há ~300 anos, "O Almirante") descobriu o que a Rainha fazia com as viagens e foi mandado pela

 - NA T3: os Pilares são as potências que precisam ser MOVIDAS contra o vilão (a vila->nação conquista o apoio deles:
   a Santa como aliada natural; o Dragão Pesado pelo reino dos dragões; o Martelo por um preço em anos; o Lobo pelo
   desafio; a Sentinela pela floresta; o Dobrador como mentor/rival da magia espacial e alvo dos mesmos caçadores).
   O BAÚ ENTRA NA OITAVA CADEIRA (clímax de meio/fim da T3, depois de um feito de potência mundial), com TÍTULO dado pelo
   mundo: candidatos "O Que Guarda", "O Baú Sem Fundo", "A Tampa do Mundo" (o jogador pode escolher entre 3). Os outros
   reagem ao mímico na cadeira (humor e respeito). A queda da Lanterna deixa uma segunda cadeira vaga no fim da trilogia.
