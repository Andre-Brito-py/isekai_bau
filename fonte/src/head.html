<!--
  RENASCI COMO BAÚ — Capítulo 1: "Tente não ser aberto"
  Arquivo único, funciona offline. Arte, música e história geradas em código.

  ===================== BÍBLIA DO MUNDO (referência para expansões) =====================
  PREMISSA: O protagonista (nome escolhido pelo jogador) morreu na Terra, numa segunda-feira
  chuvosa, quando o ÔNIBUS 31 foi engolido por um clarão branco. Todas as almas do ônibus
  caíram em outro mundo. Algumas viraram HERÓIS invocados (em cima); outras viraram MONSTROS
  (embaixo, na Masmorra de Velhágua). O protagonista é a ALMA Nº 31 e renasceu como MÍMICO.

  MUNDO: Masmorra de Velhágua, sob o reino de Auren. A masmorra é viva e "arquiva" almas.
  O CATÁLOGO DO ABISMO é a voz-sistema da masmorra (texto entre colchetes, tom burocrático,
  humor seco). Ninguém sabe ainda QUEM escreve o Catálogo — mistério central de longo prazo.

  PERSONAGENS
  - Protagonista: monólogo interno engraçado, leitor de mangá, sabe que "isso é um isekai".
  - Ofélia: fantasma bibliotecária da Sala de Leitura Afogada, morta há ~300 anos. Sarcástica,
    gentil, obcecada por anotar tudo. Afirma não poder sair da biblioteca. Conta almas (sabe que
    o protagonista é a nº 31). Segredo futuro: ela também foi uma alma de outro mundo, de um
    "ônibus" muito mais antigo (uma carruagem? um navio?) — revelar no Cap. 3+.
  - Guarda-Musgo: golem que impede "coisas de baixo" de subir. Derrotado no Cap. 1.
    Últimas palavras: "cuidado com o herói".
  - Herói Nº 30: humano invocado no Andar 2, fala gírias brasileiras ("foi mal", "força do
    hábito"). Também estava no ônibus 31. Antagonista/espelho do Cap. 2. Pode virar aliado.

  SISTEMAS
  - Runas: Mímicos "comem palavras". Elemento (Brasa, Geada, Seiva) + Forma (Dardo, Onda, Véu)
    + Modificador opcional (Eco, Foco). O jogador nomeia o feitiço.
  - Evolução estilo "linha evolutiva": Mímico-Caixote (nv 5) -> Baú de Ferro (tanque, mordida)
    ou Relicário Arcano (magia, ganha Foco, feitiços custam -1). Nível de espécie reinicia.
  - Lanternas de Âmbar: salvam, curam e despertam os monstros de novo.

  CAPÍTULO 2 — "HERÓI NÚMERO 30" (Andar 2: Mercado Afundado)
  Patamar -> Mercado (Faísca) -> Acampamento da Guilda (furtividade: B = Imitar Mobília, patrulhas
  com cone de visão; Chave do Teatro; Corrente) -> Teatro Submerso (Selo; mini-chefe Polvo do Camarote;
  LUME se junta) -> Ponte do Sino (escura, exige a luz da Lume; chefe Capitã Brida + Farejador).
  - LUME: alma nº 12, musicista de rua, cantarolava no fundo do ônibus (a música do título É a canção
    dela). Virou um Lustre-Vivo. Odeia escuro, dramática, engraçada. Canta a cada 3 turnos na batalha.
  - TIAGO (Herói nº 30): era o COBRADOR do ônibus 31. Bondoso, avalia monstros antes de lutar.
    Poupou o protagonista. Avisou: alguém no Andar 3 está reunindo heróis para uma guerra contra a
    masmorra. Fica do lado do protagonista "por baixo dos panos".
  - CAPITÃ BRIDA: caçadora de mímicos, orgulhosa; derrotada, mas viva. Pode voltar como rival/aliada.
  - FIM DO CAP. 2: o Catálogo detecta que um HUMANO o leu (a Avaliação do Tiago) e "fica nervoso".
  - 3ª evolução (nível 8 do 2º grau): Cofre-Fortaleza (contra-ataque), Baú Espinhoso (espinhos),
    Grimório Vivo (eco grátis), Relicário Estelar (regenera PM).

  CAPÍTULO 3 — "QUEM ESCREVE O CATÁLOGO" (feito; data3.js)
  Gatilho: o Sino toca, a Lume começa a ser ARQUIVADA (pisca). Carta da Ofélia: achar quem escreve o Catálogo.
  Escadaria do Sino -> Muralhas de Auren (fosso: Geada; portão: Faísca; sala secreta: Sombra) ->
  Pátio da Guarnição (patrulhas + PORTADORES DE FAROL, cuja luz anula o disfarce; névoa: ONDA de Vento) ->
  Jaula dos Monstros (Dona Cida, alma nº 7, gata-fantasma; aprendizes da Brida; mini-chefe Carcereiro;
  runas Vento e Sombra) -> Scriptorium Suspenso (chefe: Inquisidora Maren; o Escriba acorrentado).
  - Mecânica nova: SELOS RÚNICOS no mapa (exigem o feitiço certo, às vezes elemento + forma; gastam PM).
  - Técnicas exclusivas implementadas (TECH/LINE_TECH); 4º grau no nível 11 do 3º grau, com custo de
    MEMÓRIA: a primeira perdida é "o sabor do pastel" (G.flags.mem_pastel). Diálogos reagem a isso.
  - Opcional: 5 Páginas do Catálogo (todas = Fragmento), missão da Dona Cida (óculos), missão da Brida
    (soltar Pip, Nina e Tolo = técnica Escudo da Guilda + Fragmento), chefe secreto CAVALEIRO SEM NOME
    (guarda-costas da Ofélia séculos atrás; deixa a "Fita da Bibliotecária", G.flags.knightRibbon).
  - FATOS: Brida morreu protegendo a Lume (arquivada pelo Selo do Arquivo; G.flags.bridaArchived).
    Maren fugiu ferida, deixando o chapéu (volta no Cap. 5 ou na T2). O Escriba é só a "mão":
    copia o que é ditado "de baixo do primeiro andar". Arquivar = digerir alma. A Lume parou de apagar.
  - GANCHO CAP. 4: descer ao Arquivo Profundo, abaixo do Andar 1. A Ofélia sempre soube o caminho.
    Usar a Fita da Bibliotecária e o Cavaleiro como prova do passado dela. Os aprendizes da Brida (se
    salvos) podem reaparecer como aliados humanos. Dona Cida pode guiar até outras almas do 31.

  CAPÍTULO 4 — "A PRIMEIRA VIAGEM" (feito; data4.js)
  Início: CALHA DE DEVOLUÇÃO no Scriptorium (cond ch3done) -> cai na Biblioteca; Ofélia drena o canto sul
  e viaja DENTRO da tampa do protagonista ("tecnicamente nunca sai de casa"; o Arquivo é o porão dela).
  Escada da Maré -> Achados e Perdidos (hub; BENTO, caranguejo-ermitão num bule, ex-menino de recados da
  carruagem; runa Sal) -> Estrada Afogada (3 lembranças da 1ª viagem; mini-chefe CARRUAGEM AFOGADA do cocheiro
  ANSELMO, que chama Ofélia de "Dona Clara" ao morrer; Chave do Correio) -> Correio Submerso (Âncora, Maré,
  cartas) -> Fundo do Arquivo (fichários das almas; gaveta da Brida; chefe CLARA, de Sal).
  - Mecânica nova: MARÉ global (G.flags.tide, padrão alta). Sinos alternam. 'a' = piso que alaga na maré alta;
    'b' = estante que boia (só passa na maré alta). Mapas validados por build/ch4/validate4.py (sem softlock;
    sino nunca encosta em tile de maré).
  - Combate: status ESQUECIMENTO (trava 1 feitiço/técnica por 2 turnos); SEQUÊNCIA DE MEMÓRIA (seq com hide:
    setas somem); Clara PREVÊ a ação que você mais usa (BT.acts) e pune se você repetir; errar a leitura
    faz ela perder o turno. Runas: SAL (incomum, corrói DEF; Véu = crosta contra status), ÂNCORA (forma rara,
    fura casca/sumiço e afunda golpes preparados), MARÉ (mod raro, repete o feitiço a 60% no fim da rodada).
    Itens: Biscoito de Água e Sal (cura status), Chá de Cidreira (PM), Sino de Bolso (desfaz preparações).
    Técnica comum DEVOLVER AO REMETENTE (missão das 3 cartas do Bento): reflete o próximo feitiço defendido.
  - Opcional: 5 Lembranças Perdidas (bilhete do 31 do protagonista; fone remendado da Lume = canções mais
    fortes, G.flags.lumeFone; ferradura da égua Estrela; dente de leite do Bento; carta de "C." para Inês)
    -> Fragmento + 2 Sinos + runa Foco. Pastel nº 31 (comer = G.flags.ateMemory / deixar = leftMemory).
    Gaveta da Brida: levar o apito (bridaWhistle) ou deixar luz (bridaLight).
  - FATOS: Ofélia é CLARA VENTURA, 26 anos, alma nº 1 da PRIMEIRA VIAGEM (carruagem, 12 pessoas, ~300 anos),
    ia visitar a irmã INÊS; escolheu o nome Ofélia por causa do livro no colo (Hamlet, ato quatro).
    Ela separou de si a parte que lembra (CLARA, de Sal), que virou a BOCA que dita o Catálogo; o Escriba é a
    mão; a VOZ vem de mais fundo e falou pela 1ª vez: "Trinta e um. Você é o último que faltava na COLEÇÃO."
    ESCOLHA: G.flags.ofeliaRemembers (true = Clara voltou e Ofélia lembra de tudo; false = Clara dorme).
  - GANCHO CAP. 5: carta do Tiago: a guerra desceu do Andar 3; o recrutador é SEU JORGE, o MOTORISTA do 31
    (quepe azul, molho de chaves no cinto). Espelho do cocheiro Anselmo ("levar todo mundo de volta pra casa").
    Os aprendizes da Brida podem aparecer (apito). "Coleção" = a masmorra quer as 31 almas completas (Cap. 7).

  CAPÍTULO 5 — "O MOTORISTA" (feito; data5.js)
  Início: TUBO PNEUMÁTICO no Fundo do Arquivo (cond ch4done) -> Terminal Rodoviário (cópia do Terminal Central
  da cidade, feita pela masmorra a partir da memória do Jorge; QG dos heróis; Tiago infiltrado) -> Trincheira do
  Mercado (BOMBARDEIO; MUSGO = o Guarda-Musgo remendado, agora líder da resistência dos monstros; dá o Crachá
  de Motorista) -> Pátio de Manobras (BONDES nos trilhos; mini-chefe MAREN, SEM CHAPÉU; ela é poupada e foge)
  -> Oficina de Guerra (armas feitas de monstros; runa Pólvora; jaulas; sala secreta atrás de entulho com o
  chefe secreto FISCAL DA LINHA) -> Garagem do 31 (chefe SEU JORGE, o motorista; Tiago intervém na fase 2).
  - Mecânicas: perigos de mapa no ritmo (MAP.booms: bombas com alvo vermelho e bondes com sino; tiram 12-15%
    dos PV, nunca matam); FORMAÇÃO (enemy.guardian: enquanto o Escudeiro vive, aliados sofrem metade do dano);
    Fiscal pede uma PASSAGEM (elemento ou mordida) a cada turno; Jorge anuncia a PRÓXIMA PARADA (Feira cura,
    Escola = sequência de memória, Ponto Final = golpe enorme cancelável com Âncora ou Sino de Bolso).
  - Runas: PÓLVORA (incomum, explode de novo em todos no fim da rodada), MINA (forma rara, explode quando o
    alvo age), BANDEIRA (mod raro, +20% ataque e magia por 2 turnos). Itens: Quentinha, Café de Garrafa
    Térmica, Vale-Transporte (volta à última Lanterna). Técnica de missão: APITO DA BRIDA (aprendizes livres
    no Cap. 3 + apito levado da gaveta no Cap. 4). 4º grau ganhou 2ª e 3ª técnica (níveis 3 e 6 do grau).
  - FATOS: SEU JORGE A., motorista da Linha 31 por 23 anos, "soltou o volante" no clarão; recruta heróis para
    descer com o 31 cheio de pólvora rúnica e explodir o coração da masmorra ("monstro não volta pra casa").
    Diário de Bordo (2 páginas opcionais) muda o fim da luta (G.flags.jorgeDiary). ESCOLHA: jorgeFate
    'livre' (Tiago vai junto, tiagoTaken=true) ou 'preso' (fica com o Musgo; Tiago fica com você).
    No fim, a VOZ toma o 31: "O ônibus é meu. As almas são minhas. A coleção está quase completa." O 31
    afunda no chão da garagem levando o Jorge (e o Tiago, se ele foi junto). Maren poupada (marenSpared).
  - GANCHO CAP. 6 "Almas do 31": juntar as almas do ônibus espalhadas pela masmorra (Dona Cida nº 7, Lume
    nº 12, os heróis do Andar 3, o Musgo como aliado) para ir buscar o 31 antes que a coleção se complete.

  CAPÍTULO 6 — "ALMAS DO 31" (feito; data6.js + maps6.js gerado por build/ch6/maps6.py)
  Tema: o que você esquece não some; vira parte da masmorra. Lembrar quem se é = não poder ser colecionado.
  REGRA NOVA DO MUNDO: a VOZ puxa pela LINHA 31 as almas do ônibus que esqueceram quem eram (DESBOTADAS) para o
  Ponto Final. Quem LEMBRA do próprio nome resiste (prova: a Dona Cida, com os óculos, não foi puxada).
  Início: a mancha de óleo na Garagem (cond ch5done) vira uma FAIXA AMARELA; o bilhete 31 brilha e o chão afunda.
  A masmorra montou o TRAJETO DO 31 com a memória de cada passageiro. Mapas (itinerário):
  1) PONTO DA PADARIA (hub; a parada do PROTAGONISTA, feita da memória dele, com pedaços borrados pelo que ele já
     perdeu; Lanterna; quadro de itinerário: Feira, Escola, Coreto, Ponto Final). O caminho para o Ponto Final é
     uma PORTA DE MEMÓRIA que só abre com as três canções de parada ("só passa quem sabe o caminho de cor").
  2) FEIRA DE SEGUNDA (memória da DONA CIDA, nº 7, e do SEU OZÓRIO, nº 9, pasteleiro). Cida desce pela linha e
     resiste; vira guia. Ozório virou TACHO FERVENTE, repete "Olha o pastel, três e cinquenta!". Memória perdida:
     o CADERNO DE FIADO (dívida do protagonista: dois pastéis de queijo; última página: desenho da filha, BIA).
     Com o caderno: ele LEMBRA (soul_ozorio='lembrou'), ensina o PREGÃO DA FEIRA e dá pastéis. Sem o caderno: luta
     contra o Tacho; ele desbota e segue para o Ponto Final ('perdido'); o papagaio dele repete o pregão.
  3) ESCOLA ESTADUAL (memória da PROFª NEIDE, nº 15). Mecânica CHAMADA: portas de sala perguntam o banco de cada
     passageiro (Cida 7, Ozório 9, Lume 12, Neide 15, Duda 22, Tiago 30, Jorge 0); errar chama um Bedel. A última
     porta pergunta "Quem é você?" e a resposta certa é o NOME do jogador (não "alma 31", não "um baú").
     Neide virou a DIRETORA DE GIZ que obriga alunos desbotados a copiar para sempre. Memória: DIÁRIO DE CLASSE
     (nomes dos alunos e o dela na capa). Lembrou = ensina SINAL DO RECREIO e a técnica CHAMADA. Senão, o sinal sai
     do sino do pátio depois da última porta. DUDA, nº 22, 17 anos, heroína invocada que desertou, se esconde no
     banheiro da escola: conta que os heróis do Andar 3 estão sendo puxados também (ela lembra; não corre perigo).
  4) CORETO DA PRAÇA (o coreto que Velhágua perdeu, com a banda dentro: prova de que a masmorra agora come a
     superfície). SEU VALDIR, nº 4, virou o JABUTI DO CORETO (o coreto está no casco dele: ele virou o lugar onde
     dançaram). DONA MARLENE, nº 5, 78 anos, heroína invocada de bobes e espada, procura o marido. Mini-chefe
     MAESTRO AFOGADO (morador de Velhágua; mantém a banda tocando para a praça nunca acabar). Vencido, a banda toca
     a VALSA DO CORETO uma última vez; a Lume aprende; tocar a valsa acorda o Valdir. ESCOLHA: Valdir não sai do
     lugar (ele É o coreto) e pede que levem a Marlene; ela quer ficar. marleneFate 'junto' (os dois ficam,
     lembrados) ou 'conosco' (ela vem e luta ao seu lado no Ponto Final; o Valdir fica sozinho, em paz).
  5) PONTO FINAL (chefe O PASSAGEIRO 32). Uma fila de passageiros desbotados entra num ônibus de névoa. O 32 é uma
     figura de capa de chuva costurada com tudo o que os passageiros ESQUECERAM (o quepe do Jorge, a valsa, o
     sabor do pastel...). Fala com frases roubadas. Fases: BILHETERIA (devolve o seu último feitiço contra você),
     LOTAÇÃO (chama os desbotados como golpes; cada alma que você fez lembrar responde "Presente!" e bloqueia um),
     COLEÇÃO (sequência de memória longa). Vencido, vira luzes que voltam aos donos.
     ESCOLHA FINAL: duas luzes emaranhadas, só dá para segurar uma: O SABOR DO PASTEL (sua memória) ou O FIM DA
     CANÇÃO DA LUME (ela canta a música do título a vida toda sem lembrar como termina). ch6Gift 'pastel'|'cancao'.
  - GANCHO CAP. 7 "O Selado": a linha desce até uma porta redonda com 31 fechaduras. O 31 está estacionado na
    frente, com os desbotados dentro (e o Jorge, e o Tiago se foi junto). Do outro lado, alguém bate três vezes.
    A VOZ: "Obrigada por organizar a fila, trinta e um." O Musgo chega com a resistência; a Rita e os aprendizes
    também, se você os ajudou. Os bilhetes carimbados (almas que lembraram) são chaves.
  - MECÂNICAS: CANÇÕES (mapa): a Lume toca melodias (sequência de setas) em PORTAS DE MEMÓRIA; G.tunes guarda as
    aprendidas (onibus, pregao, recreio, valsa). ACALMAR (batalha): Lembranças têm "calma" (Avaliar mostra o
    elemento); feitiço do elemento certo enche a calma (CANTO enche em dobro); cheia = o inimigo vai embora em
    paz (conta como vitória, G.flags.calmed). CHAMADA (história).
  - RUNAS: CANTO (elemento incomum, rosa: acalma em dobro, 20% de encantar; Véu = Coro, cura 6%/turno por 3),
    CORO (forma rara: todos os inimigos, mais forte para cada alma do 31 reunida), BILHETE (mod raro: o próximo
    golpe inimigo contra você sai pela metade). Itens: Pastel de Feira, Caldo de Cana, Cordinha de Parada (fuga).
  - Almas reunidas (contam para CORO, Chamada e o chefe): Lume, Cida, Tiago (se ficou), Ozório, Neide, Duda,
    Marlene/Valdir. soulOk(k)/soulsCount()/lostSouls(); flags soul_ozorio/soul_neide/soul_cida ('lembrou'|'perdido').
  - FATOS: OZÓRIO FERREIRA, pasteleiro, banco 9, filha BIA (ficou na Terra); o protagonista deve 2 pastéis de
    queijo (anotado). NEIDE APARECIDA LINS, português, banco 15, levava 32 redações para corrigir. DUDA = MARIA
    EDUARDA, 17, banco 22, Rua das Acácias 40, portão verde; heroína desertora. MARLENE (banco 5) e VALDIR SOUZA
    (banco 4), casados há 52 anos; ele virou o jabuti do coreto. MAESTRO TEODORO PRATES, Banda Municipal de
    Velhágua: "diga que a banda tocou até o fim" (G.flags.maestroBaton = gancho da T2 em Velhágua). LUME tem uma
    irmã mais nova, LÍVIA; a música do título foi feita para ela dormir (só revelado se ch6Gift='cancao').
  - As portas da padaria: a cena da Porta Final avisa quem ainda não lembrou e sela o destino (vira 'perdido').
  - Balanceamento (piloto, Desafio): ver build/test17.py (argumento extra = caminho "perdido", luta contra o Tacho).
  GANCHOS PARA O CAP. 7 "O SELADO": a Porta Redonda com 31 fechaduras no fim da escada do Ponto Final; o 31
  estacionado (Jorge ao volante; Tiago junto se tiagoTaken); algo bate do outro lado três vezes; a Voz agradece por
  "organizar a fila". A resistência desceu (Musgo, monstros, Rita se dateDone, aprendizes, almas que lembraram).
  Bilhetes carimbados = chaves. Dilema: abrir (o que está selado sobe com eles) ou manter fechada (a coleção fica
  presa para sempre). 5º grau (Arca da Origem / Mímico Vazio) entra aqui. Pagar o fiado do Ozório (piada que vira
  cena). Se ch6Gift='cancao', a canção completa da Lume tem efeito no Cap. 8.

  CAPÍTULO 7 — "O SELADO" (FEITO; data7.js + maps7.js gerado por build/ch7/maps7.py; teste: build/test18.py)
  Fatos para o Cap. 8: G.flags.saved7 = ids das almas trazidas (soul_X = 'resgatado' para ozorio/neide/cida);
  grau5; fiadoPago; clueLantern (manifesto); capitaoLuneta (chefe secreto vencido: a luneta pode servir no Cap. 8);
  moca7 (o Selado falou). Fim: Jorge e Tiago acordam, a Voz grita "VOCÊS ROUBARAM A MINHA COLEÇÃO", todos para
  o 31. A Bala de Âmbar e a Água do Cais seguem existindo como itens.
  Tema: o que a gente tranca dentro de si; decisões sem volta; quanto cabe dentro de um baú.
  1) ANTESSALA DA PORTA (hub; Lanterna). A resistência acampa na frente da PORTA REDONDA (31 fechaduras). Cada
     alma que lembrou acende a sua fechadura com o bilhete; as dos perdidos ficam escuras. No centro, entalhe de
     LANTERNA COM UM OLHO (pista). Uma 32ª fechadura, pequena e sem número, aberta POR DENTRO (pista). O 31 está
     estacionado e congelado: Jorge ao volante (e Tiago, se tiagoTaken), olhos abertos, motor ligado.
     Ozório cobra o fiado (piada vira cena: o baú oferece um gole do Frasco de Âmbar, o Ozório sente "cheiro de
     gente", recusa e rasga a página: "me paga quando tiver rosto"; G.flags.fiadoPago). Rita (se dateDone) e Marlene (se conosco) têm falas. Ideia da Lume: "Você é um baú. Baús têm
     fechadura." O protagonista encosta a PRÓPRIA fechadura na 32ª e passa. Só ele e a Lume. Os outros seguram a
     antessala contra a FILA (passageiros sem rosto) que a Voz manda.
  2) CAIS DE ÂMBAR: um mar subterrâneo de âmbar líquido (almas digeridas, dito sem rodeio pela Lume). Pontes de
     tábuas velhas. CRISTAIS DE ALMA: passageiros perdidos presos em pilares de âmbar (do 31 e da Viagem Zero).
  3) CONVÉS DA BARCA (a VIAGEM ZERO, encalhada há ~900 anos; o Catálogo diz "Viagem 3" ao contar e se corrige,
     pista). Mini-chefe O TIMONEIRO, que segue virando o leme para um porto que não existe.
  4) PORÃO DA BARCA: cristais, manifesto de embarque ("Viagem Zero — 40 almas — embarque autorizado por:" e só o
     desenho de uma lanterna com um olho; pista). Sala lacrada (runa CHAVE) com o chefe secreto O CAPITÃO.
     Depois do Timoneiro: 5º GRAU (escolha de história, não de nível): ARCA DA ORIGEM ou MÍMICO VAZIO.
  5) CELA DO SELO: chefe O LACRE REAL, um selo de cera vivo com o brasão da lanterna-com-olho, burocrata (CARIMBOS).
     Vencido, o lacre racha e o SELADO fala pela primeira vez: a MOÇA DA BARCA, sem nome ("levaram o meu nome
     junto com a outra metade de mim"; "a outra metade ainda acende lanternas lá em cima" é o MÁXIMO de pista
     permitido). Ela não sai ainda: o lacre só rachou. Ela pede que levem as almas e "não deixem ela chamar de novo".
  - Volta pela fechadura com os cristais carregados: na antessala eles acordam com nome e rosto. O lacre rachado
    solta o 31: Jorge e Tiago acordam. GANCHO CAP. 8: a masmorra inteira treme; a Voz percebe o roubo da coleção;
    "A Tampa se Fecha": subir com o 31 lotado, de dentro para fora, enquanto a masmorra desaba.
  - MECÂNICAS: CRISTAIS DE ALMA + ESPAÇO NA TAMPA (G.flags.carry, lista de ids; capacidade 3; Arca = 6; Vazio = 10).

    anterior; ARQUIVADO = esquecimento; DEVOLVIDO = reflete o próximo feitiço; CHAVE ou ÂMBAR quebram o carimbo).
  - 5º GRAU: ARCA DA ORIGEM (aceitar ser o novo Catálogo: muito mais forte, carrega 6, técnica DILÚVIO cresce com
    as almas carregadas; o Catálogo passa a falar "nós") ou MÍMICO VAZIO (abrir mão do poder e das memórias:

    TODAS as lembranças da Terra: mem_pastel volta a ser perdido, pastelBack some; o rosto humano do Cap. 8 fica

  - RUNAS: ÂMBAR (elemento raro: cristaliza, 25% de prender por 1 turno; Véu = casca que divide o dano por 2 nos
    próximos 2 golpes), CHAVE (forma rara: um alvo, arranca casca/sumiço/força e abre fechaduras no mapa).

  CAPÍTULO 8 — "A TAMPA SE FECHA" (FEITO; data8.js + maps8.js gerado por build/ch8/maps8.py; teste: build/test19.py)
  Fatos gravados: finalChoice ('devolver'|'guardar'), helped8 (quem ajudou nos obstáculos), pages8Done, brida8, maren8,
  escribaDone, catalogoDone, runaRosto, seasonDone; herança em localStorage 'renasci_heranca' (+ código RCB-H1).
  Balanceamento (piloto 0.6, Desafio): Escriba deixa 35% (Ferro/Arca) e 50% (mago/Vazio); Catálogo deixa 37% e ~10%.
  O Catálogo usa muitos golpes de MAGIA (defendidos com MAG): é isso que aperta o caminho do Ferro sem esmagar o mago.
  Resposta certa na FICHA: desfaz a correção e causa 2% da vida do chefe (não pode virar o ataque principal).
  Tema: identidade. O Catálogo tenta reescrever quem você é; você responde com a própria história.
  Início: na antessala (ch7done), todo mundo entra no 31. A masmorra desaba; o Jorge dirige subindo a LINHA 31 ao
  contrário, de dentro para fora. Mapas (subida): 1) GARGANTA DA LINHA (túnel desabando; pedras com alvo vermelho;
  Lanterna) -> 2) TERMINAL EM RUÍNAS (o QG dos heróis, abandonado; Maren, se poupada, avisa que a Inquisição
  "responde a alguém que nunca envelhece") -> 3) SCRIPTORIUM DESABADO (mini-chefe O ESCRIBA, a mão do Catálogo,
  agora sem corrente) -> 4) BIBLIOTECA AFOGADA (Ofélia; a lição do nome; Lanterna antes do chefe) -> 5) O ÍNDICE
  (o coração do Catálogo, embaixo da biblioteca; CHEFE FINAL O CATÁLOGO) -> 6) A TAMPA (a sala onde o baú acordou
  no Cap. 1; a saída para o céu).
  - MECÂNICA DE MAPA: PASSAGEIROS DO 31. Obstáculos (entulho, escuro, vão, porta emperrada, fila de desbotados)
    se resolvem chamando alguém que está no ônibus. Quem pode ajudar depende das escolhas da temporada inteira
    (Musgo e Lume sempre; Jorge; Tiago se tiagoTaken; Marlene se conosco; Rita se dateDone; Neide/Ozório/Cida se
    lembraram ou foram resgatados; aprendizes; almas trazidas do âmbar). Nunca trava: sempre há alguém.
  - INIMIGOS: Passageiro sem Rosto (acalmável com Canto), Fichário Vivo, Tinteiro Errante, Marca-Página,
    Leitor de Cinzas, Boca da Fome (elite).
  - RUNAS: CÉU (elemento raro, a palavra que ninguém lá embaixo conhecia: limpa os seus estados; Véu = Céu Aberto,
    imune a cegueira e esquecimento por 3 turnos) e NOME (modificador raro: o feitiço vai assinado com o seu nome;
    não pode ser copiado, refletido nem catalogado; +30% contra quem lê: Escriba, Leitor, Catálogo).
  - O ESCRIBA (mini-chefe): RISCA um comando no ar antes de agir (MORDER, MAGIA ou ITEM). Usar o comando riscado
    falha e dói. Copia o seu último feitiço. Fase 2: escreve com as duas mãos.
  - O CATÁLOGO (chefe final; a luta MAIS DIFÍCIL do jogo, pedido do usuário; visual especial e mecânica única):
    VISUAL: a arena vira um livro aberto gigante; o Catálogo é desenhado ao vivo (não é sprite fixo): um livro
    enorme flutuando, páginas que viram sozinhas, texto se escrevendo, fitas de marcador como tentáculos e um rosto
    de colchetes "[ • ]" (é a voz entre colchetes do jogo inteiro). Fase 3: as páginas pegam fogo cor de âmbar e a
    lombada abre como uma boca (a Voz empurrando por trás).
    MECÂNICA ÚNICA: A FICHA. O Catálogo aplica CORREÇÕES na sua ficha, que mudam a própria interface:
    NOME (você vira "ALMA 31" na faixa do grupo; ninguém consegue te chamar: sem ajudas, dano -20%), ESPÉCIE (o
    sprite volta a ser o Mímico-Caixote e ATQ/DEF/MAG caem para 65%) e REGISTRO (sem ITEM e um feitiço apagado).
    O botão FUGIR vira RESPONDER: o Catálogo faz uma pergunta da SUA ficha, montada do save (sua 2ª evolução, a
    quem você deve dois pastéis, quem cantava no fundo do ônibus, o seu nome, a escolha do Cap. 6...). Acertar
    apaga uma correção e causa dano de VERDADE; errar dói e a correção fica. O Mímico Vazio não tem memórias da
    Terra: as perguntas da Terra aparecem como [arquivado] e viram perguntas da masmorra.
    Fases: ÍNDICE (cataloga o que você mais usa: ações repetidas rendem menos), REVISÃO (correções em dobro),
    ÚLTIMA PÁGINA (a Voz empurra; golpes enormes; cada alma salva grita "Presente!" e bloqueia um golpe; se
    ch6Gift='cancao', a Lume canta a canção inteira uma vez). Ao morrer: "ela vai chamar de novo"; a última página é
    assinada só com uma lanterna.
  - ESCOLHA FINAL (G.flags.finalChoice): DEVOLVER (abrir o coração de âmbar; as almas sobem como luz; a masmorra
    para de comer Velhágua; as Lanternas apagam; Auren fica sem âmbar no inverno) ou GUARDAR (o baú fecha o coração
    dentro de si: as almas dormem a salvo, ninguém colhe o âmbar; todo mundo na superfície vai querer o baú).
  - RUNA DO ROSTO: a Ofélia ensina; forma humana (8 corpos pela linha de 4º grau, aura pelo 5º grau, nitidez pelas
    memórias). HERANÇA (renasci_heranca + código), FEITOS e RENOME gravados no fim. Última cena: o céu.
  - OPCIONAL: as Três Últimas Páginas do Catálogo (Fragmento + pista); a Ficha da Brida no Índice (se arquivada).

  HUMANIDADE E HUMOR (humor.js; vale para todos os capítulos)
  O baú foi uma pessoa comum e isso tem que aparecer: ele CORA (blush(): tampa rosada, vapor e coração no
  mapa) perto de mulheres que acha bonitas, fica sem jeito, lembra de besteiras da vida (suculenta Gerson,
  30 reais devendo ao primo, academia "de dedo"). Pensamentos aleatórios nas Lanternas (THOUGHTS). Cenas:
  Madame Pavio (vela vendedora, Mercado), bilhete "Quer sair comigo?" da 8ª série (Achados), a primeira
  Clériga em batalha ("Ela reza bonito"), e o ENCONTRO com a RITA no Terminal (estilo encontro de RPG:
  3 perguntas com escolhas e um medidor de "Clima"; nota alta = beijinho na fechadura e G.flags.ritaPromise:
  "Quando você arranjar um rosto, me procura. O pastel é por minha conta."). Regras: humor como alívio,
  nunca no meio de cena grave; flerte só com personagens adultos; nunca com aprendizes ou crianças.
  RETRATOS (portraits.js): bustos 32x32 com 3 quadros (parado, falando, piscando) para os personagens
  importantes. Todo personagem novo com nome e várias falas ganha retrato próprio (bust() para humanos).

  BATALHA EM CENA (v2.0, pedido do usuário, layout no estilo da referência do Deltarune): arena preta grande (0-132)
  com cenário no topo; o baú à esquerda, de perfil, com a Lume flutuando atrás; inimigos em diagonal à direita;
  faixa do grupo (retrato, nome, PV, PM) em 134; caixa de texto em 150 (desenhada com BOXDY); botões em 224.
  TAMANHOS REAIS, todos em escala 1x ou 2x (nunca fracionada): baú e chefes (48px) em 1x; gente, cães, gárgulas em 2x
  (32px); bichinhos (EN_TINY: rato, cogumelo, morcego, lodo, lamparina, caranguejos, polvo de toldo, traça) em 1x.
  INIMIGO NOVO = decidir o tamanho (EN_TINY ou d.bsc). Sprite de batalha do baú para cada forma (32x34) com poses idle
  (respira e pisca), open (mordida/feitiço/técnica, com aura da cor do elemento), shut (defesa), hurt (golpe) e win.
  Inimigos avançam um pouco ao atacar (e.lunge). FORMA NOVA = adicionar cores em PB_MAP e detalhes em pbFrame.
  ANIMAÇÕES DE SKILLS (fx.js, pedido do usuário): feitiço = ELEMENTO (aparência: projétil e impacto próprios) +
  FORMA (trajeto: dardo voa, onda varre o chão, corrente salta entre alvos, âncora cai do alto, mina é arremessada)
  + MODIFICADOR (foco carrega antes, selo deixa círculo, dreno puxa luzes de volta, maré, bandeira). Véu = aura
  própria por elemento. Toda técnica tem animação em TECH_FX. O dano aparece no momento do impacto.
  REGRA: runa, elemento ou técnica NOVA só entra com animação própria (drawProj/drawImpact/fxWave/TECH_FX).
  CENÁRIOS DE BATALHA (battlebg.js): cada mapa aponta para um cenário (BG_OF ou map.battleScene). MAPA NOVO =
  escolher ou criar um cenário. ESTILO DE ARTE DE REFERÊNCIA (imagens do Deltarune enviadas pelo usuário, só como
  estilo): fundo quase preto, cenário em 2-3 tons saturados de uma mesma cor, bordas com brilho, brilhos de 4 pontas,
  chão iluminado; personagens com contorno escuro forte e cores vivas. Arte sempre original.
  EFEITOS EM BATALHA (v1.9): estados viram ícones de pixel (icons.js), nunca palavras soltas. Os do jogador ficam na faixa acima da
  caixa; os dos inimigos, numa coluna ao lado do sprite. Selo = círculo mágico na cor do elemento.
  REGRA TÉCNICA: o build concatena tudo num só escopo; NUNCA declarar função global com nome já usado (uma auxiliar 'ring' dos
  ícones apagou o minijogo de defesa). Auxiliares novas levam prefixo do arquivo (icPx, icRing...). Checar duplicatas antes de publicar.
  ARTE DOS PERSONAGENS (v2.2): as artes vêm de imagens geradas pelo usuário numa IA de imagem (build/arteia/elenco.png e
  lume.png). build/arteia/gerar.py recorta cada personagem, reduz na mesma escala (fator 6.4; humanos ~48 px de altura),
  limpa o magenta, reduz a paleta, monta 4 quadros de animação (respirar, acenar a cabeça; fantasma ondula; Escriba flutua;
  a Lume canta com os quadros dela) e os retratos 32x32 (cabeça ampliada 2x), e escreve src/arte_ia.js. Os prompts usados
  estão no documento "Renasci como Baú: prompts de arte dos personagens". Personagem novo = pedir a arte com o mesmo bloco
  de estilo, salvar em build/arteia e acrescentar a caixa em proc.py.
  PARTE 2 (v2.3, build/arteia/gerar2.py -> src/arte_ia2.js): vistas de lado/costas (os personagens se viram para o baú a
  até 3 tiles), as 17 formas do baú (aberto de frente, de lado e fechado; ~26 px no mapa, ~36 px na batalha; o disfarce usa
  o fechado), a Lume com expressões (dorme quando o baú fica parado), Madame Pavio, Bento e a forma humana das 8 linhas de
  4º grau (retrato grande, retrato de diálogo e corpo no mapa; Vazio fica translúcido).
  ESTILO DE PERSONAGENS (decidido com o usuário, a partir de uma folha de sprites do Deltarune; só o estilo, nunca os
  personagens): sprites de personagem maiores que os tiles (cerca de 20x30 no mapa), cabeça grande, contorno escuro grosso,
  2-3 tons chapados por cor, cores bem saturadas, rosto simples (olhos de um ou dois pixels, sem gradiente).
  ESCOPO: o baú (todas as formas), a Lume e os personagens com nome, no mapa e na batalha. Inimigos comuns ficam como estão.
  A forma humana (Runa do Rosto) também segue esse estilo, inclusive no retrato.
  REGRA DE ARTE DOS CHEFES (pedido do usuário, vale para sempre): TODO chefe, mini-chefe e chefe secreto
  tem que ser MUITO bem caprichado. Sprite de batalha próprio em bosses.js (48x48, escala 2, 4 quadros, com
  BIGSP + big()): contorno, luz e sombra, textura, acessórios que contem quem ele é (ex.: o Polvo tem cartola,
  monóculo, binóculo de teatro e uma rosa) e pelo menos duas partes animadas. Nunca reaproveitar um sprite
  pequeno ampliado para chefe. Conferir numa folha de sprites antes de publicar.

  FORMA HUMANA E ROMANCE (plano)
  - No fim da Temporada 1 (Cap. 8), depois da escolha final, o protagonista ganha a RUNA DO ROSTO: a lição da
    Ofélia/Clara sobre escolher o próprio nome vira magia. Ela deixa assumir uma forma humana por um tempo.
  - A fidelidade da forma depende das MEMÓRIAS que sobraram: cada memória paga nas evoluções deixa o rosto
    mais borrado (sem o pastel, ele não lembra o próprio sorriso direito). Guardar memórias tem valor real.
  - Na Temporada 2 (a superfície), a forma humana serve para andar entre humanos sem ser caçado; ela dura
    pouco e cansa, e o corpo de baú continua sendo o verdadeiro.
  - A FORMA HUMANA HERDA A EVOLUÇÃO (decidido com o usuário): o rosto é o mesmo para todos, mas o corpo carrega
    traços da forma final do baú. Três camadas se somam:
    1) LINHA DE 4º GRAU = traço físico e de figurino:
       Arca Bastião: ombros largos, postura de guarda, placas de ferro e rebites como ombreiras, voz grave.
       Cofre-Abismo: olhos escuros demais, sorriso largo, fome constante (come tudo, piada recorrente).
       Ferrão-Relicário: cabelo espetado, unhas verdes, um ferrão-pingente no pescoço.
       Baú Carniceiro: cicatrizes de dente nos braços, dentes um pouco pontudos, sempre faminto e quente.
       Biblioteca Ambulante: dedos manchados de tinta, casaco de folhas costuradas, fala citando coisas.
       Grimório Proibido: runas tatuadas que brilham com a magia, uma mecha de cabelo cor de tinta.
       Relicário Eclipse: sombra que se mexe sozinha, olhos que brilham no escuro.
       Constelação Viva: sardas que são estrelas de verdade e piscam, cabelo com pontinhos de luz.
    2) GRAU 5 (escolha da história) = a aura: ARCA DA ORIGEM deixa fechaduras douradas nos olhos e o corpo
       mais estável; MÍMICO VAZIO deixa o contorno meio translúcido e a forma dura menos, mas é mais livre.
    3) MEMÓRIAS guardadas = nitidez do rosto (já planejado acima).
    Além disso, sempre uma lembrança do baú: um fecho dourado (cinto, colar ou brinco) e o costume de sentar em
    cantos, imóvel, quando está nervoso. Sprite e retrato humanos: 8 variantes de corpo x 2 auras.
  - SAVE HERDADO PELA TEMPORADA 2 (decidido com o usuário):
    * Ao terminar o Cap. 8, o jogo grava um registro de HERANÇA separado (chave 'renasci_heranca' no
      localStorage), que não é apagado ao sobrescrever saves.
    * Conteúdo: nome do jogador, linha completa de evolução (1º ao 5º grau), aparência da forma humana (as 3
      camadas acima), memórias guardadas/perdidas, destino da Lume, escolhas-chave (G.flags: Rita e
      dateScore/ritaPromise, Ofélia, Clara, Maren, Jorge, Catálogo), chefes secretos vencidos, tempo de jogo
      e dificuldade. NÃO leva nível nem números: a T2 começa do zero em força, mas com a mesma identidade.
    * FEITOS (decidido com o usuário): a herança leva a lista de feitos do personagem, e a T2 os menciona em
      diálogos, cartazes, canções de taverna e rumores. Cada feito tem id, frase curta e capítulo. Exemplos:
      venceu o Polvo Camarote; poupou ou derrotou a Brida; libertou as jaulas; resolveu o caso do bonde do
      Jorge; venceu cada chefe secreto; zerou no Desafio; terminou sem usar o frasco num chefe; guardou todas
      as memórias; encontro com a Rita (e a nota dele). Feitos raros geram reações raras (um NPC que
      desconfia, um bardo que errou a história, uma criança fantasiada de baú).
      Implementação: no Cap. 8, montar a lista a partir das G.flags que já existem (chefes, missões,
      escolhas); de agora em diante, todo capítulo novo deve gravar flags claras para cada feito novo.
    * NÍVEL DE PODER NA LORE: a T2 recomeça os números, mas a história reconhece quem o baú é. A herança
      guarda um RENOME calculado a partir do grau final, do nível, dos chefes e dos feitos, em faixas:
      Curiosidade da masmorra < Ameaça local < Lenda de Velhágua < Coisa que não devia existir.
      O renome muda como a superfície reage: guardas que fogem ou chamam reforço, guildas que oferecem
      contrato, inimigos que já conhecem as técnicas dele, preços e portas.
      Motivo para o poder voltar ao zero: o corpo de baú é feito do mana da masmorra; fora dela ele
      enfraquece (e a Runa do Rosto consome muito). O poder não some, fica ADORMECIDO: ao longo da T2 ele
      volta em marcos da história ("o baú lembra como era ser uma Arca Bastião"), recuperando as técnicas
      da linha herdada mais rápido que um save novo.
    * A forma herdada dá na T2 a técnica-assinatura da linha (ex.: Baluarte para Bastião) já no começo, e
      os personagens que voltam lembram o que aconteceu.
    * Como passar: a T2 será publicada no mesmo domínio (andre-brito-py.github.io), então lê a herança
      direto, sem nenhum passo. Para trocar de aparelho ou recuperar, a tela final mostra também um
      CÓDIGO DE HERANÇA (texto curto com verificação) para copiar e colar na T2.
    * Quem começa a T2 sem save escolhe uma forma e algumas escolhas numa tela de "lembranças".
  - Romance opcional, devagar, só com adultos, a partir da T2. Sementes já plantadas: RITA (ex-escudeira,
    flags dateDone/dateScore/ritaPromise) e o humor da Madame Pavio. Outras opções podem surgir na T2.

  POR QUE A GUILDA E A COROA DESCERAM — "A GRANDE DESCIDA" (lore.js, pedido do usuário)
  - Versão oficial: Velhágua está afundando (a masmorra engoliu a Rua dos Tanoeiros, o poço e o coreto; os
    Achados e Perdidos do Cap. 4 vêm de lá). A Coroa convoca caçadores para limpar os andares.
  - Verdade: ÂMBAR. É o resto doce e dourado que sobra quando a masmorra termina de ler uma alma (lembrança
    cristalizada). Na superfície acende cidades, cura e vale 200 moedas o frasco. As Lanternas e o Frasco do
    jogador também são âmbar ("lembrança de outra pessoa"). Monstro vivo rende mais âmbar que monstro morto.
  - Cada lado quer uma coisa: a COROA quer luz (os faróis da capital apagam no inverno; todo âmbar vai ao
    Tesouro); a GUILDA quer dinheiro (paga por cabeça, 1/10 do âmbar; equipamento para TODO tipo de monstro);
    JORGE quer levar o 31 para casa. O alfinete dourado no fundo do mapa: "CORAÇÃO — âmbar para cem invernos".
    Destruir a masmorra (plano do Jorge) = colheita total de âmbar para a Coroa. Jorge não leu essa parte.
  - Onde aparece: Cap. 2 Edital (acampamento, flag lore_edital); Cap. 3 Quadro de Ordens (pátio, lore_ambar);
    Cap. 5 Mesa da Grande Descida (terminal, lore_descida). Caixotes 'K' variam por região (LOOK_K).
  - Para a T2: a política do âmbar é o centro do Reino de Auren. Feito "descobriu o segredo do âmbar".

  >>> SEGREDO DA TRILOGIA (o usuário pediu SURPRESA: nunca revelar no chat; só plantar pistas e pagar no jogo) <<<
  O VILÃO POR TRÁS DE TUDO: A RAINHA-LANTERNA DE AUREN (nome de coroação: SERENÍSSIMA AURÉLIA; nome verdadeiro:
  ADA, a ALMA Nº 1 DA VIAGEM ZERO, uma barca que atravessou ~900 anos atrás, antes da carruagem).
  - Ada sobreviveu à própria digestão aprendendo a CHAMAR: abriu a primeira "passagem" e ofereceu outra viagem no
    lugar dela. Desde então, a cada ~300 anos, ela puxa um veículo cheio de almas de outro mundo (a barca, a
    carruagem da Ofélia, o ônibus 31). Ela é QUEM CHAMOU O 31 (pergunta da T3).
  - Por quê: as almas digeridas viram ÂMBAR, e o âmbar a mantém viva e jovem há 900 anos e acende Auren. A Coroa,
    o edital, a Grande Descida e o "Coração" (âmbar para cem invernos) são o braço visível do plano dela.
  - A VOZ (antagonista da T1) não é a vilã final: é a fome da masmorra, que Ada alimenta e direciona. A Voz quer a
    coleção completa porque Ada prometeu que, completa, a masmorra "dorme" e para de afundar Velhágua. É mentira:
    completa, a coleção vira o maior bloco de âmbar da história.
  - O SELADO (T2): a primeira coisa que Ada trancou: a BARCA e o próprio corpo original dela, que ainda lembra quem
    ela era. Quando ele sobe no fim da T1, não é um monstro do fim do mundo: é a consciência que Ada arrancou de si
    (espelho direto da Ofélia/Clara: a Clara separou a parte que lembra; Ada trancou a parte que sente culpa).
  - T3: voltar para a Terra exige a passagem que só Ada sabe abrir. Ela oferece a volta em troca da próxima viagem.
  PISTAS PARA PLANTAR (sutis, sem nome):
  - Cap. 7: a Porta Redonda tem, no centro, um entalhe de LANTERNA COM UM OLHO (o mesmo brasão dos Portadores de
    Farol do Cap. 3). Uma 32ª fechadura menor, sem número, já aberta por dentro. O Catálogo erra a contagem de
    viagens: "Viagem 3" (o jogador só conhece duas). Bento ou Ofélia lembram de uma "moça da barca" nas histórias
    que o cocheiro contava.
  - Cap. 8: o Catálogo, ao morrer, diz "ela vai chamar de novo"; a última página do Catálogo é assinada só com uma
    lanterna. Na superfície, os faróis de Auren brilham cor de âmbar. Maren (se poupada) avisa que a Inquisição
    "responde a alguém que nunca envelhece".
  - Detalhes já existentes que viram pista: lanternas de âmbar salvam (alimentam alguém); o maestro "diga que a banda
    tocou até o fim"; Ofélia contava as almas desde sempre; "Velhágua" (água velha).

  ESTRUTURA: TEMPORADA 1 DE UMA TRILOGIA (meta: 10-15 h de jogo no total)
  Esta temporada se passa inteira dentro da Masmorra de Velhágua. Fecha o arco do Catálogo e deixa
  um gancho forte para a Temporada 2. Duração-alvo por capítulo, sem enchimento: história principal
  ~1h15-1h45 + 20-30 min de conteúdo opcional que vale a pena (missões paralelas, chefes secretos,
  baús escondidos, Fragmentos de Âmbar, completar o Bestiário da Ofélia).
    1. Tente não ser aberto ............ Andar 1 ................ ~45 min (feito)
    2. Herói Número 30 ................. Andar 2 ................ ~1h20 (feito)
    3. Quem Escreve o Catálogo ......... Andar 3, Fortaleza dos Invocados; sacrifício da Brida; 4º grau
    4. A Primeira Viagem ............... Arquivo Profundo (abaixo do Andar 1); passado da Ofélia
    5. O Motorista ..................... Linha de frente da guerra; alma nº 0; Tiago dividido
    6. Almas do 31 ..................... Reencontrar outras almas do ônibus espalhadas pela masmorra
                                         (cada uma vira aliado ou inimigo conforme as escolhas)
    7. O Selado ........................ O que a masmorra prende; 5º grau; decisões sem volta
    8. A Tampa se Fecha (final) ........ Chefe final: o próprio Catálogo. Escolha final. RUNA DO ROSTO (forma humana).
  Total estimado: ~11 h de história + 2-3 h opcionais = 13-14 h.
  CONTEÚDO OPCIONAL RECORRENTE (a partir do Cap. 3): 2-3 missões paralelas por capítulo ligadas às
  almas do ônibus; 1 chefe secreto a cada 2 capítulos; Bestiário da Ofélia (avaliar todo monstro dá
  recompensas); arena de desafio na biblioteca; runas raras escondidas.
  FINAL DA TEMPORADA 1: o arco do Catálogo se resolve, mas a escolha final abre a tampa da masmorra
  para a superfície. Algo do que estava selado sobe junto. Última cena: o protagonista vê o céu
  pela primeira vez desde o ônibus. "FIM DA TEMPORADA 1".
  TRILOGIA (títulos provisórios):
    T1 "Renasci como Baú" .... a masmorra; tema: identidade.
    T2 ...................... a superfície e o Reino de Auren; política, heróis contra monstros, o
                               selado à solta; Tiago e o motorista com papéis maiores; tema: pertencimento.
    T3 ...................... o caminho de volta para a Terra (ou não); quem chamou o ônibus 31 e por quê;
                               tema: luto e despedida. As escolhas da T1 e da T2 importam (save herdado).
  O save da T1 deve guardar as escolhas-chave em G.flags para serem herdadas pela T2.

  ÁRVORE DE EVOLUÇÃO FUTURA (cada grau reinicia o nível; 4º grau por volta do nv 8 do 3º grau, Cap. 3-4)
  - Cofre-Fortaleza -> ARCA BASTIÃO (puxa para si os golpes contra a Lume; contra-ataque em área)
                    -> COFRE-ABISMO (engole inimigos com menos de 15% de PV; cura ao engolir)
  - Baú Espinhoso   -> FERRÃO-RELICÁRIO (mordidas causam sangramento acumulativo)
                    -> BAÚ CARNICEIRO (mordidas roubam vida; fica mais forte com PV baixo)
  - Grimório Vivo   -> BIBLIOTECA AMBULANTE (feitiços inimigos ENGOLIDOS viram runas aprendidas:
                       Tinta, Sombra, Vento... é aqui que o jogador ganha as magias dos chefes)
                    -> GRIMÓRIO PROIBIDO (feitiços com 2 modificadores; custam PV além de PM)
  - Relicário Estelar -> RELICÁRIO ECLIPSE (runa Sombra; feitiços mais fortes no escuro)
                      -> CONSTELAÇÃO VIVA (invoca estrelas que atacam sozinhas por 3 turnos)
  - 5º grau (final, Cap. 6+): forma única definida pelas ESCOLHAS da história, não por atributos:
    ARCA DA ORIGEM (aceitar ser o novo Catálogo) ou MÍMICO VAZIO (abrir mão do poder e das memórias).
  - PREÇO DA EVOLUÇÃO (a partir do Cap. 3): cada evolução apaga uma memória da Terra do protagonista.
    Mostrar com sutileza: o sabor do pastel some, depois o rosto de alguém, depois o próprio nome antigo.
    As canções da Lume guardam essas memórias; perder a Lume teria um custo real.

  TÉCNICAS EXCLUSIVAS POR LINHA EVOLUTIVA (implementar a partir do Cap. 3)
  O caminho escolhido muda O QUE o jogador faz em batalha, não só os números.
  - Interface: o botão MORDER vira um submenu (Mordida + técnicas aprendidas). Magias continuam em MAGIA.
  - Linha de FERRO usa RECARGA (turnos de espera), sem gastar PM. Linha ARCANA usa PM.
  - Aprendizado: 1 técnica ao evoluir, outra no nível 3 e outra no nível 6 de cada grau. Algumas só
    por história ou missão paralela (ex.: "Escudo da Guilda", ensinada pela Brida antes do sacrifício).
  - Ao chegar no Cap. 3, quem já tem forma de 3º grau recebe a primeira técnica dela na hora.
    Cofre-Fortaleza ... FECHAR TAMPA (postura: dano ×0.4 por 1 rodada; defesa perfeita contra-ataca em dobro)
                        INVESTIDA DE COFRE (mordida que atordoa 40%)
      Arca Bastião .... PROTEGER (recebe no lugar da Lume) · MURALHA (todo o grupo -30% de dano por 3 turnos)
      Cofre-Abismo .... ENGOLIR INTEIRO (executa inimigo comum com menos de 20% PV e cura)
    Baú Espinhoso ..... RAJADA DE ESPINHOS (acerta todos e causa sangramento) · MORDIDA DILACERANTE
      Ferrão-Relicário  VENENO CONCENTRADO (sangramento vira veneno que se acumula)
      Baú Carniceiro .. DEVORAR (rouba vida; mais forte quanto menor o seu PV)
    Grimório Vivo ..... RELEITURA (repete o último feitiço pela metade do custo)
                        MARCADOR DE PÁGINA (o próximo feitiço sai ×1.8)
      Biblioteca Amb. . COPIAR (o próximo feitiço inimigo engolido vira runa permanente)
      Grimório Proib. . PACTO (converte PV em PM; feitiços com 2 modificadores)
    Relicário Estelar . CHUVA DE ESTRELAS (vários golpes aleatórios) · ÓRBITA (estrela que absorve 1 golpe)
      Relicário Eclipse ESCURIDÃO (inimigos erram mais; janelas de desvio maiores por 3 turnos)
      Constelação Viva  INVOCAR ESTRELA (aliado que ataca sozinho por 3 turnos)
  - Técnica comum a todos, liberada no Cap. 3: IMITAR MOBÍLIA EM BATALHA (vira baú: inimigos comuns
    perdem o alvo por 1 turno; não funciona com chefes, que "já sabem").
  - Chefes do Cap. 3 em diante devem ter fraquezas que premiam técnicas diferentes, para cada linha
    ter seu momento de brilhar.

  ARCO DE TOM (a história fica mais profunda e séria a cada capítulo)
  - Cap. 1-2: humor leve, mistério, "isso é um isekai". Ninguém morre de verdade.
  - Cap. 3 "Quem Escreve o Catálogo": a guerra deixa de ser abstrata. Heróis recrutados à força;
    um personagem querido se sacrifica (candidata: Brida, protegendo os aprendizes). Descoberta: "ser
    arquivado" pelo Catálogo significa ter a alma DIGERIDA pela masmorra, e é isso que a mantém viva.
  - Cap. 4 "A Primeira Viagem": Ofélia foi a alma nº 1 de uma viagem séculos atrás (uma carruagem).
    Ela escolheu esquecer quem era para não enlouquecer. A bibliotecária sarcástica é uma máscara.
  - Cap. 5 "O Motorista": o motorista do ônibus 31 (alma nº 0) é quem recruta os heróis no Andar 3.
    Ele carrega a culpa do acidente e quer destruir a masmorra para "devolver" todos para casa, mas
    destruí-la libertaria o que ela mantém selado embaixo. Não é vilão: é luto mal resolvido.
  - Cap. 6+: escolha final. Não existe lado certo: monstros e heróis são vítimas do mesmo ônibus.
  - TEMAS: identidade (o que sobra de você quando muda de corpo e de memória), luto (todos morreram;
    há famílias na Terra que nunca vão saber), escolha (proteger ou destruir), amizade como âncora.
  - REGRAS DE ESCRITA: o humor continua, mas como alívio, cada vez mais raro nos momentos graves.
    Cenas sérias têm texto mais lento, pausas (|) e silêncio musical. Nada de violência gráfica. As
    escolhas do jogador têm consequência visível (quem sobrevive, que forma final fica disponível).
    Plantar pistas cedo e pagar depois (o Catálogo "nervoso", a contagem da Ofélia, a música da Lume).

  GANCHOS PARA O CAP. 3 ("Quem Escreve o Catálogo"): subir ao Andar 3; a pessoa que recruta heróis
  (talvez o MOTORISTA do ônibus, alma nº 1?); revelar pistas de que Ofélia veio de uma "viagem" antiga;
  novo aliado monstro do ônibus; runas Sombra/Vento; 4ª evolução por volta do nível 10 do 3º grau.

  LANTERNAS (v1.9): só uma no começo de cada capítulo e uma antes de cada chefe (2-4 por capítulo).
  Capítulos novos seguem essa regra.
  CURA E SAVE (v1.3): Lanternas de Âmbar SALVAM e enchem o FRASCO DE ÂMBAR, mas NÃO curam. O frasco tem
  3 goles (45% PV + 30% PM cada); Fragmentos de Âmbar em baús escondidos dão +1 gole (Poço, Acampamento,
  Teatro). Subir de nível cura só 25%. Evoluir cura tudo. Perder volta à última Lanterna com tudo cheio.
  TETOS DE CURA (v2.1, pedido do usuário: Carniceiro curava demais): roubo de vida passivo 10% da mordida (até 4% dos PV);
  Devorar 25% do dano (até 12%); Banquete até 12% somando as três mordidas; Boca do Vazio até 15%; Seiva que suga até 15%;
  Véu de Seiva até 50% dos PV (65% com Foco). Toda cura nova de técnica precisa de teto proporcional aos PV máximos.
  Dano recebido = ATQ x poder x 60/(60+DEF) (defesa proporcional, não subtrai valor fixo).

  RUNAS CONSUMÍVEIS (v1.6): criar um feitiço GASTA 1 de cada runa usada (o feitiço fica para sempre;
  esquecer não devolve nada). Inventário em G.rq (G.runes = runas já descobertas). Raridades:
  Comum (Brasa, Geada, Seiva, Dardo) · Incomum (Onda, Véu, Faísca, Vento) ·
  Rara (Corrente, Eco, Selo, Sombra, Dreno) · Épica (Foco). Pedestal da 1ª descoberta dá 2/2/1/1.
  Fontes: pedestais; baús com runa (comuns no Cap. 1, incomuns no Cap. 2, raras escondidas no fim do
  Cap. 2 e no Cap. 3, a única Foco extra no Scriptorium); drop ao vencer (12% + 2% por nível da área,
  raridade sobe com a área, tabela MAP_D 1-9; chefes dão 1 comum + 1 incomum/rara/épica); ENGOLIR um
  feitiço inimigo tem 35% de chance de cristalizar a runa do elemento; FUSÃO nas Lanternas
  (2 iguais em raridade → 1 conhecida da mesma; 3 → 1 da raridade de cima). Selos sempre têm a runa
  necessária por perto (Geada na Escadaria, Faísca nas Muralhas, Onda no Pátio e na Jaula).
  Novas áreas: adicionar o mapa em MAP_D e 1-3 baús de runa coerentes com a dificuldade.

  COMBATE v2 (combat.js): cada golpe inimigo tem um TIPO de defesa:
  anel (A no círculo) · desvio (seta certa no fim da trajetória) · sequência (repetir setas) ·
  agarrão (apertar A rápido; alguns prendem e roubam o turno) · feitiço (A no anel para ENGOLIR e ganhar PM).
  Inimigos também se fortalecem (ATQ↑), se protegem (CASCA, Faísca quebra), somem (SOME, magia acerta),
  curam aliados e causam VENENO, QUEIMADURA, SILÊNCIO ou CEGUEIRA. Frasco e Véu de Seiva curam status.
  Escada de complexidade: Galeria = só anel + 1 habilidade simples; Poço = estreia desvio, agarrão e o
  1º feitiço inimigo; Cap. 2 = sequências, carapaça, silêncio, combos com aliado; Veteranos = sequências
  rápidas e flechas triplas. Chefes misturam tudo e usam feitiços feitos de RUNAS do jogador
  (Véu de Seiva, Onda de Geada, Corrente de Tinta, Dardo de Faísca Selado).
  Dificuldade: DESAFIO (padrão: ATQ ×1.35, PV ×1.3, chefes ×1.15, golpes preparados, fúria, fintas)
  ou HISTÓRIA (valores originais), trocável no MENU.

  CURVA DE DIFICULDADE (testada com piloto automático, defesa certa em 50-60% das vezes):
  áreas comuns custam 5-40% da vida por luta; mini-chefe deixa o jogador com 30-80%;
  chefe final do capítulo deixa com 30-50%. XP por nível é multiplicada pelo grau (1x, 1.6x, 2.5x).
  =======================================================================================
-->
<style>

  background:radial-gradient(circle at 50% 45%,var(--btn-hi) 0,var(--btn) 62%,var(--btn) 100%);
  border:2px solid var(--btn-edge);box-shadow:inset 0 -6px 0 rgba(0,0,0,.35),0 4px 12px rgba(0,0,0,.35)}

#dpad .su{clip-path:polygon(50% 50%,8% 0,92% 0)} #dpad .sd{clip-path:polygon(50% 50%,8% 100%,92% 100%)}

#dpad.on-left .tl{border-right-color:var(--amber)} #dpad.on-right .tr{border-left-color:var(--amber)}

  border-radius:999px;padding:8px 12px;touch-action:none}
