<title>Renasci como Baú</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0b0912">
<!--
  RENASCI COMO BAÚ — Capítulo 1: "Tente não ser aberto"
  Arquivo único, funciona offline. Arte, música e história geradas em código.

  ===================== BÍBLIA DO MUNDO (referência para expansões) =====================
  PREMISSA: O protagonista (nome escolhido pelo jogador) morreu na Terra, numa segunda-feira
  chuvosa, quando o ÔNIBUS 31 foi engolido por um clarão branco. Todas as almas do ônibus
  caíram em outro mundo. Algumas viraram HERÓIS invocados (em cima); outras viraram MONSTROS
  (embaixo, na Masmorra de Velhágua). O protagonista é a ALMA Nº 31 e renasceu como MÍMICO.

  MUNDO: Masmorra de Velhágua, sob o reino de Auren. A masmorra é viva e "arquiva" almas.
  O CATÁLOGO DO ABISMO é a voz-sistema da masmorra (texto entre colchetes, tom burocrático,
  humor seco). Ninguém sabe ainda QUEM escreve o Catálogo — mistério central de longo prazo.

  PERSONAGENS
  - Protagonista: monólogo interno engraçado, leitor de mangá, sabe que "isso é um isekai".
  - Ofélia: fantasma bibliotecária da Sala de Leitura Afogada, morta há ~300 anos. Sarcástica,
    gentil, obcecada por anotar tudo. Afirma não poder sair da biblioteca. Conta almas (sabe que
    o protagonista é a nº 31). Segredo futuro: ela também foi uma alma de outro mundo, de um
    "ônibus" muito mais antigo (uma carruagem? um navio?) — revelar no Cap. 3+.
  - Guarda-Musgo: golem que impede "coisas de baixo" de subir. Derrotado no Cap. 1.
    Últimas palavras: "cuidado com o herói".
  - Herói Nº 30: humano invocado no Andar 2, fala gírias brasileiras ("foi mal", "força do
    hábito"). Também estava no ônibus 31. Antagonista/espelho do Cap. 2. Pode virar aliado.

  SISTEMAS
  - Runas: Mímicos "comem palavras". Elemento (Brasa, Geada, Seiva) + Forma (Dardo, Onda, Véu)
    + Modificador opcional (Eco, Foco). O jogador nomeia o feitiço.
  - Evolução estilo "linha evolutiva": Mímico-Caixote (nv 5) -> Baú de Ferro (tanque, mordida)
    ou Relicário Arcano (magia, ganha Foco, feitiços custam -1). Nível de espécie reinicia.
  - Lanternas de Âmbar: salvam, curam e despertam os monstros de novo.

  GANCHOS PARA O CAP. 2 ("Herói Número 30"): subir ao Andar 2; aventureiros caçam baús;
  encontrar outra alma do ônibus reencarnada como monstro (ideia: uma Aranha-Tear ou um
  Lustre-Vivo); segunda evolução por volta do nível 10; novas runas (Faísca, Sombra, Corrente).
  =======================================================================================
-->
<style>
:root{
  /* Layout: tela de jogo centralizada + controle de portátil embaixo (retrato) ou nas laterais (paisagem) */
  --bg:#0b0912; --shell:#15111d; --btn:#262033; --btn-edge:#0a0810; --btn-hi:#3a3150;
  --amber:#f2b544; --rose:#e0566f; --ink:#efe6d3; --dim:#8a8099;
  --ui:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
body{font-family:var(--ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
#app{height:100%;display:grid;grid-template-rows:1fr auto;grid-template-columns:1fr;gap:8px;padding-block:8px;box-sizing:border-box}
#stage{position:relative;display:flex;align-items:center;justify-content:center;min-height:0;min-width:0}
#screen{image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:#000;
  box-shadow:0 0 0 2px #000,0 0 0 4px #2a2236,0 12px 40px rgba(0,0,0,.6);border-radius:2px}
#pad{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 4px 10px;max-width:480px;width:100%;margin:0 auto;box-sizing:border-box}
#dpad{position:relative;width:150px;height:150px;touch-action:none}
#dpad .arm{position:absolute;background:var(--btn);border:2px solid var(--btn-edge);box-shadow:inset 0 -4px 0 rgba(0,0,0,.35)}
#dpad .h{left:0;top:50px;width:146px;height:46px;border-radius:8px}
#dpad .v{left:50px;top:0;width:46px;height:146px;border-radius:8px}
#dpad .hub{position:absolute;left:62px;top:62px;width:26px;height:26px;border-radius:50%;background:var(--btn-edge);opacity:.5}
#dpad .tri{position:absolute;width:0;height:0;border:8px solid transparent;opacity:.55}
#dpad .tu{left:67px;top:12px;border-bottom:10px solid var(--dim)} #dpad .td{left:67px;bottom:12px;border-top:10px solid var(--dim)}
#dpad .tl{top:67px;left:12px;border-right:10px solid var(--dim)} #dpad .tr{top:67px;right:12px;border-left:10px solid var(--dim)}
#dpad.on-up .tu{border-bottom-color:var(--amber);opacity:1} #dpad.on-down .td{border-top-color:var(--amber);opacity:1}
#dpad.on-left .tl{border-right-color:var(--amber);opacity:1} #dpad.on-right .tr{border-left-color:var(--amber);opacity:1}
#mid{display:flex;flex-direction:column;align-items:center;gap:8px}
.pill{font:600 11px/1 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);background:var(--btn);border:2px solid var(--btn-edge);
  border-radius:999px;padding:8px 12px;touch-action:none}
.pill.down{background:var(--btn-hi);color:var(--ink)}
#ab{position:relative;width:150px;height:130px}
.rb{position:absolute;border-radius:50%;background:var(--btn);border:2px solid var(--btn-edge);box-shadow:inset 0 -5px 0 rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:center;font:700 22px/1 var(--ui);color:var(--dim);touch-action:none}
#ba{width:70px;height:70px;right:4px;top:6px;color:var(--amber)} #bb{width:58px;height:58px;left:8px;top:58px;color:var(--rose)}
.rb.down,.pill.down{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.35);background:var(--btn-hi)}
.lbl{position:absolute;font:600 10px/1 var(--ui);letter-spacing:.1em;color:var(--dim)}
@media (orientation:landscape) and (min-aspect-ratio:4/3){
  #app{grid-template-columns:auto 1fr auto;grid-template-rows:1fr}
  #pad{display:contents}
  #dpad{grid-column:1;grid-row:1;align-self:center}
  #stage{grid-column:2;grid-row:1}
  #right{grid-column:3;grid-row:1;align-self:center}
}
#right{display:flex;flex-direction:column;align-items:center;gap:10px}
#mid{flex-direction:row}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,3,10,.72);z-index:20;padding:16px;box-sizing:border-box}
#ovbox{width:min(360px,100%);background:#0d0a14;border:3px solid var(--ink);padding:18px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;
  font-family:ui-monospace,"Courier New",monospace}
#ovbox h2{margin:0;font:700 15px/1.3 ui-monospace,"Courier New",monospace;color:var(--amber);letter-spacing:.04em}
#ovbox p{margin:0;font:13px/1.45 ui-monospace,"Courier New",monospace;color:var(--dim)}
#ovbox input,#ovbox textarea{font:16px ui-monospace,"Courier New",monospace;background:#000;color:var(--ink);border:2px solid #4a405c;padding:10px;outline:none;width:100%;box-sizing:border-box;-webkit-user-select:text;user-select:text}
#ovbox textarea{height:96px;resize:none;font-size:12px;word-break:break-all}
#ovbox input:focus,#ovbox textarea:focus{border-color:var(--amber)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.ob{flex:1;font:700 14px/1 ui-monospace,"Courier New",monospace;padding:12px;background:#000;color:var(--ink);border:2px solid var(--ink);cursor:pointer;min-width:90px}
.ob.pri{color:#000;background:var(--amber);border-color:var(--amber)}
.ob:focus-visible,.pill:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#msg{min-height:1em;color:var(--amber)!important}
</style>
<div id="app">
  <div id="stage"><canvas id="screen" width="240" height="240" aria-label="Tela do jogo"></canvas></div>
  <div id="pad">
    <div id="dpad" aria-label="Direcional"><div class="arm h"></div><div class="arm v"></div><div class="hub"></div>
      <div class="tri tu"></div><div class="tri td"></div><div class="tri tl"></div><div class="tri tr"></div></div>
    <div id="right"><div id="mid"><div class="pill" data-k="menu" id="bm">Menu</div><div class="pill" data-k="mute" id="bs">Som</div></div><div id="ab"><div class="rb" id="ba" data-k="a">A</div><div class="rb" id="bb" data-k="b">B</div></div></div>
  </div>
</div>
<div id="ov" hidden><div id="ovbox"></div></div>
